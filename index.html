<title>Сказочная дорожка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--teal:#2bb0ba;--teal-d:#14808a;--yel:#f7c548;--ink:#23364d;--mut:#5d6c7c;--bg:#fbf8f0;--card:#fff;--line:#e8e3d6;--ok:#4caf6d;--no:#ec7a62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,"Segoe UI",Arial,sans-serif;font-weight:800}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--teal-d);outline-offset:2px}
img{display:block;max-width:100%}
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 14px 24px}
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.icon{width:48px;height:48px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.icon svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;font-size:18px;font-weight:900;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--yel)}
.hero{display:flex;align-items:center;gap:14px;background:var(--teal);color:#fff;border-radius:22px;padding:14px 16px;margin-bottom:14px}
.hero img{width:70px;border-radius:12px;flex:none}
.hero h1{margin:0;font-size:clamp(25px,6.5vw,38px);font-weight:900;line-height:1.05}
.hero p{margin:4px 0 0;font-size:15px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tale{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;text-align:center}
.tale img{width:100%;height:92px;object-fit:contain}
.tale b{display:block;font-size:18px;font-weight:900;margin-top:4px;line-height:1.1}
.st{color:var(--mut);font-size:14px;margin-top:3px}.st em{font-style:normal;color:#d99a00}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.lv .n{width:46px;height:46px;border-radius:14px;background:var(--yel);display:grid;place-items:center;font-size:23px;font-weight:900;flex:none}
.lv b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.lv small{display:block;font-size:14px;font-weight:700;color:var(--mut);margin-top:2px}
.lv .s{margin-left:auto;color:#d99a00;font-size:18px;white-space:nowrap;letter-spacing:1px}.lv .s u{text-decoration:none;color:var(--line)}
.q{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 4px}
.q .t{font-size:clamp(25px,6.6vw,36px);font-weight:900;text-align:center;line-height:1.15}
.say{width:56px;height:56px;border-radius:50%;background:var(--teal);flex:none;display:grid;place-items:center}
.say svg{width:28px;height:28px;fill:#fff}
.hint{text-align:center;color:var(--mut);font-size:15px;font-weight:700;margin:0 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:20px;aspect-ratio:1.15;padding:8px;display:grid;place-items:center;overflow:hidden}
.opt img{width:100%;height:100%;object-fit:contain}
.opts.three{grid-template-columns:repeat(3,1fr)}.opts.three .opt{aspect-ratio:.9}
.opt span{display:block;font-size:14px;text-align:center;margin-top:2px}
.good{border-color:var(--ok)!important;background:#eaf7ee!important}
.bad{animation:sh .35s;border-color:var(--no)!important}
@keyframes sh{20%{transform:translateX(-8px)}50%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:520px;width:100%;margin:0 auto}
@media(min-width:620px){.mem{grid-template-columns:repeat(4,1fr);max-width:none}}
.mc{aspect-ratio:1;border-radius:16px;background:var(--teal);border:3px solid var(--teal-d);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900;overflow:hidden;padding:0}
.mc.open{background:var(--card);border-color:var(--line)}.mc.done{border-color:var(--ok);background:#eaf7ee}
.mc img{width:88%;height:88%;object-fit:contain}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.slot{aspect-ratio:1.25;border-radius:10px;border:2px dashed #cfc8b6;background:#fff;overflow:hidden;display:grid;place-items:center;color:#b3ab97;font-size:16px}
.slot.f{border:2px solid var(--ok)}.slot img{width:100%;height:100%;object-fit:contain}
.scn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sc{background:var(--card);border:3px solid var(--line);border-radius:16px;aspect-ratio:1.6;overflow:hidden;padding:4px}
.sc img{width:100%;height:100%;object-fit:contain}.sc.used{visibility:hidden}
.pic{height:clamp(130px,30vh,220px);display:grid;place-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;margin-bottom:12px;padding:6px}
.pic img{max-height:100%;object-fit:contain}
.line{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:62px;border-bottom:3px dashed #cfc8b6;padding-bottom:10px;margin-bottom:14px}
.tok{font-size:clamp(21px,5.6vw,28px);font-weight:900;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:9px 14px;min-height:52px}
.tok.in{background:#eaf7ee;border-color:var(--ok)}.tok.used{visibility:hidden}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.msg{min-height:30px;text-align:center;font-size:21px;font-weight:900;margin:12px 0 0;color:var(--teal-d)}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.end h2{font-size:42px;margin:0;font-weight:900}
.big{font-size:56px;letter-spacing:6px;color:#e3a500;line-height:1}.big u{text-decoration:none;color:var(--line)}
.end .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 18px;font-size:23px;font-weight:900;width:100%}
.end .card small{display:block;font-size:14px;font-weight:700;color:var(--mut);margin-bottom:3px}
.btns{display:flex;gap:10px;width:100%;margin-top:6px}
.btn{flex:1;min-height:56px;border-radius:16px;background:var(--yel);font-size:20px;font-weight:900}.btn.alt{background:var(--card);border:2px solid var(--line)}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:14px}.chip{min-height:46px;padding:0 16px;border-radius:23px;background:var(--card);border:2px solid var(--line);font-size:15px}.vo{display:block;width:100%;min-height:48px;margin-top:8px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:16px;padding:6px 12px}.vo.on{border-color:var(--teal);background:#e6f6f7}
.note{font-size:13px;font-weight:700;color:var(--mut);text-align:center;margin:14px 0 0}
.tale{position:relative}.tale.lock img{filter:grayscale(1);opacity:.45}.tale.lock b{color:var(--mut)}
.lk{position:absolute;z-index:2;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:var(--yel);display:grid;place-items:center}
.lk svg,.lkb svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pro{background:#fff8e1;border:2px solid var(--yel);border-radius:20px;padding:14px 16px;margin-top:14px;text-align:center}
.pro b{display:block;font-size:19px;font-weight:900;line-height:1.2}.pro small{display:block;font-size:14px;font-weight:700;color:var(--mut);margin:3px 0 10px}
.lkb{width:72px;height:72px;border-radius:50%;background:var(--yel);display:grid;place-items:center;margin:0 auto 8px}.lkb svg{width:34px;height:34px}
.gate{text-align:center}.gate h2{font-size:26px;font-weight:900;margin:0;line-height:1.15}.gate p{font-size:15px;font-weight:700;color:var(--mut);margin:6px 0 14px}
.code{width:100%;min-height:58px;border-radius:16px;border:3px solid var(--line);background:#fff;font:inherit;font-size:28px;font-weight:900;text-align:center;letter-spacing:6px;color:var(--ink);margin-bottom:10px}
.code:focus{outline:none;border-color:var(--teal)}
.pic.dim img{filter:grayscale(1);opacity:.5}
.cf{position:fixed;top:-20px;width:11px;height:11px;border-radius:3px;animation:fall 1.8s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(500deg)}}
@media(prefers-reduced-motion:reduce){.cf{display:none}.bad{animation:none}}
.seq{display:grid;gap:7px;margin:4px 0 14px;text-align:left}.sq{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:16px}.sq i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}.sq.on{border-color:var(--ok);background:#eaf7ee}.sq.on i{background:var(--ok);border-color:var(--ok);color:#fff}.unl{background:#fff6d9;border:2px solid var(--yel);border-radius:16px;padding:10px 14px;font-size:19px;font-weight:900;width:100%}
</style></head><body><div id="app"></div>

 <div class="grid">${D.map((t,i)=>isLocked(t)?`<button class="tale lock" data-i="${i}" aria-label="${esc(t.n)} — закрыто"><span class="lk">${ICO.lock}</span><img src="${IM[t.k+'_w'+0]}" alt=""><b>${t.n}</b><div class="st">Аввал «${D[i-1].n}»</div></button>`:`<button class="tale" data-i="${i}"><img src="${IM[t.k+'_w'+0]}" alt=""><b>${t.n}</b><div class="st"><em>★</em> ${total(t.k)} / 15</div></button>`).join('')}</div>
 ${full?'':`<div class="pro"><b>Барча ${D.length} эртак — курс ўқувчилари учун</b><small>Все ${D.length} сказок — для учеников Leadership Learning House</small><button class="btn" id="key" style="width:100%">Кодни киритиш · Ввести код</button></div>`}
 <div class="ctl"><button class="chip" id="mu">${musOn?'♪ Мусиқа: ёқиқ':'♪ Мусиқа: ўчиқ'}</button><button class="chip" id="vc">Овозни танлаш</button></div><div id="vl"></div><p class="note" id="vn"></p>`;
 document.getElementById('mu').onclick=e=>{musOn=!musOn;store._music=musOn;save();e.target.textContent=musOn?'♪ Мусиқа: ёқиқ':'♪ Мусиқа: ўчиқ';if(musOn)startMusic();else stopMusic()};
 document.getElementById('vc').onclick=()=>{const l=document.getElementById('vl'),v=ruVoices();if(l.innerHTML){l.innerHTML='';return}l.innerHTML=v.length?v.map((x,i)=>`<button class="vo${voice()&&voice().name===x.name?' on':''}" data-i="${i}">${esc(x.name)}</button>`).join(''):'<p class="note">Бу қурилмада рус овози топилмади.</p>';l.querySelectorAll('.vo').forEach(b=>b.onclick=()=>{store._voice=v[+b.dataset.i].name;save();l.querySelectorAll('.vo').forEach(y=>y.classList.remove('on'));b.classList.add('on');speak('Привет! Я расскажу тебе сказку.',1.15)})};
 document.querySelectorAll('.tale').forEach(b=>b.onclick=()=>tale(D[+b.dataset.i]));
 const kb=document.getElementById('key');if(kb)kb.onclick=()=>gate(null);
 const chk=()=>{const n=document.getElementById('vn');if(n&&(!syn||!voice()))n.textContent='Агар овоз чиқмаса, сўз ва гапларни ўқитувчи ўқиб беради.'};
 chk();later(chk,1200);
}
function gate(t){clearT();if(t){const pv=D[D.indexOf(t)-1];
 $.innerHTML=bar(t.n)+`<div class="pic dim"><img src="${IM[t.k+'_p'+5]}" alt=""></div><div class="gate"><div class="lkb">${ICO.lock}</div><h2>Аввал «${pv.n}» эртагини тугат</h2><p>«${pv.n}»нинг 5 та ўйинини ўйна — «${t.n}» очилади!<br>Пройди все 5 игр сказки «${pv.n}» — и откроется «${t.n}»!</p><div class="seq">${LV.map((l,i)=>{const on=((store[pv.k]||{})[i]||0)>0;return `<div class="sq${on?' on':''}"><i>${on?'✓':i+1}</i>${l[0]}</div>`}).join('')}</div><button class="btn" id="pv" style="width:100%">«${pv.n}» га ўтиш</button><button class="chip" id="tc" style="margin-top:12px">Ўқитувчи учун · Для учителя</button><div id="tz"></div></div>`;
 wire(home);document.getElementById('pv').onclick=()=>tale(pv);
 document.getElementById('tc').onclick=()=>{const z=document.getElementById('tz');if(z.innerHTML){z.innerHTML='';return}z.innerHTML=`<p class="hint" style="margin-top:12px">Курс коди билан барча эртакларни очиш · Открыть все сказки кодом курса</p><input class="code" id="tcd" type="text" inputmode="numeric" autocomplete="off" placeholder="••••••" aria-label="Код учителя"><button class="btn" id="tok" style="width:100%">Очиш · Открыть</button><p class="hint" id="tgm"></p>`;
  document.getElementById('tok').onclick=async()=>{let g=false;try{g=await tryCode(document.getElementById('tcd').value)}catch(e){}if(g){store._all=1;save();tale(t)}else document.getElementById('tgm').textContent='Код нотўғри · Неверный код'}};
 return}
 $.innerHTML=bar(t?t.n:'Полный доступ')+(t?`<div class="pic dim"><img src="${IM[t.k+'_p'+5]}" alt=""></div>`:'')+
 `<div class="gate"><div class="lkb">${ICO.lock}</div><h2>Курс ўқувчилари учун</h2><p>Ҳозир «${D[0].n}» эртаги ҳамма учун очиқ. Барча ${D.length} эртак — Leadership Learning House ўқувчилари учун. Кодни ўқитувчингиздан олинг.<br><br>Сейчас бесплатно открыта сказка «${D[0].n}». Все ${D.length} сказок — для учеников курса. Код выдаёт учитель.</p>
 <input class="code" id="cd" type="text" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="••••••" aria-label="Код доступа">
 <div class="btns" style="margin-top:0"><button class="btn alt" id="fr">«${D[0].n}»</button><button class="btn" id="go">Очиш · Открыть</button></div><div class="msg" id="m"></div></div>`;
 wire(home);
 const inp=document.getElementById('cd'),go=document.getElementById('go');
 document.getElementById('fr').onclick=()=>tale(D[0]);
 const sub=async()=>{go.disabled=true;let ok=false;try{ok=await tryCode(inp.value)}catch(e){toast('Браузерни янгиланг · Обновите браузер');go.disabled=false;return}
  if(ok){fanfare();toast('Ура! Барча эртаклар очилди!');speak('Ура! Все сказки открыты!',1.2);later(()=>t?tale(t):home(),1300)}
  else{go.disabled=false;inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');beep(0);toast('Код нотўғри · Неверный код');inp.select()}};
 go.onclick=sub;inp.onkeydown=e=>{if(e.key==='Enter')sub()};
}
function tale(t){clearT();
 if(isLocked(t))return gate(t);
 $.innerHTML=bar(t.n)+`<div class="pic"><img src="${IM[t.k+'_p'+5]}" alt=""></div>`+(D.indexOf(t)<D.length-1&&!learnedG(t)?`<p class="hint">5 та ўйинни тугат — «${D[D.indexOf(t)+1].n}» очилади · Пройди 5 игр — откроется следующая сказка</p>`:'')+
 LV.map((l,i)=>`<button class="lv" data-i="${i}"><span class="n">${i+1}</span><span><b>${l[0]}</b><small>${l[1]}</small></span><span class="s">${stars((store[t.k]||{})[i]||0)}</span></button>`).join('');
 wire(home);
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>[words,pairs,who,order,build][+b.dataset.i](t));
}
function finish(t,lv,st,phrase){
 const was=learnedG(t);const s=store[t.k]=store[t.k]||{};s[lv]=Math.max(s[lv]||0,st);save();const nx=D[D.indexOf(t)+1],nu=!was&&learnedG(t)&&nx;
 $.innerHTML=`<div class="end"><div class="big">${stars(st)}</div><h2>Молодец!</h2>${nu?`<div class="unl">🔓 «${nx.n}» очилди! · Открыта новая сказка!</div>`:''}<div class="card"><small>Скажи вслух · Овоз чиқариб айт</small>${esc(phrase)}</div>
 <div class="btns"><button class="btn alt" id="ag">Ещё раз</button><button class="btn" id="nx">${lv<4?'Дальше':'К сказкам'}</button></div></div>`;
 fanfare();later(()=>speak(praise()+' '+phrase,1.2),1000);
 for(let i=0;i<26;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=['#2bb0ba','#f7c548','#ec7a62','#4caf6d'][i%4];c.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}
 document.getElementById('ag').onclick=()=>[words,pairs,who,order,build][lv](t);
 document.getElementById('nx').onclick=()=>lv<4?[words,pairs,who,order,build][lv+1](t):home();
}
const score=e=>e===0?3:e<=2?2:1;
const toast=(m)=>{const x=document.getElementById('m');if(x)x.textContent=m};
/* 1 */
function words(t){clearT();const q=shuf(t.w.map((_,i)=>i));let c=0,e=0;
 function r(){const a=q[c];const os=shuf([a,...shuf(t.w.map((_,i)=>i).filter(x=>x!==a)).slice(0,3)]);let lock=false;
  $.innerHTML=bar(LV[0][0])+dots(q.length,c)+`<div class="q"><button class="say" id="s" aria-label="Слушать">${ICO.say}</button><div class="t">${t.w[a]}</div></div><p class="hint">Покажи картинку · Расмини топ</p><div class="opts">${os.map(o=>`<button class="opt" data-o="${o}" aria-label="${esc(t.w[o])}"><img src="${IM[t.k+'_w'+o]}" alt=""></button>`).join('')}</div><div class="msg" id="m"></div>`;
  wire(()=>tale(t));document.getElementById('s').onclick=()=>speak(t.w[a],pOf(t.w[a]));speak(t.w[a],pOf(t.w[a]));
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;if(+b.dataset.o===a){lock=true;b.classList.add('good');beep(1);const pr=praise();toast(pr);speak(pr,1.25);later(()=>{c++;c<q.length?r():finish(t,0,score(e),t.p6[0])},1250)}else{e++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');beep(0);toast('Попробуй ещё!')}});
 }r();
}
/* 2 */
function pairs(t){clearT();const pick=shuf(t.w.map((_,i)=>i)).slice(0,6);const cs=shuf([...pick,...pick]);let open=[],lock=false,mv=0,done=0;
 $.innerHTML=bar(LV[1][0])+`<p class="hint">Найди две одинаковые картинки · Икки бир хил расмни топ</p><div class="mem">${cs.map((_,i)=>`<button class="mc" data-i="${i}" aria-label="Карточка">?</button>`).join('')}</div><div class="msg" id="m"></div>`;
 wire(()=>tale(t));
 const els=[...document.querySelectorAll('.mc')];
 els.forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('open'))return;const i=+b.dataset.i,w=cs[i];b.classList.add('open');b.innerHTML=`<img src="${IM[t.k+'_w'+w]}" alt="${esc(t.w[w])}">`;flip();speak(t.w[w],pOf(t.w[w]));open.push(b);
  if(open.length===2){mv++;lock=true;const[x,y]=open;open=[];
   if(cs[+x.dataset.i]===cs[+y.dataset.i]){x.classList.add('done');y.classList.add('done');beep(1);toast(t.w[w]);done++;lock=false;if(done===pick.length)later(()=>finish(t,1,mv<=9?3:mv<=14?2:1,t.p6[1]),900)}
   else later(()=>{[x,y].forEach(e=>{e.classList.remove('open');e.textContent='?'});lock=false},1000)}});
}
/* 3 */
function who(t){clearT();const q=shuf(t.q);let c=0,e=0;
 function r(){const[l,a]=q[c];const others=shuf(t.h.filter(x=>x!==a)).slice(0,2);const os=shuf([a,...others]);let lock=false;
  const p=pOf(t.w[a]);
  $.innerHTML=bar(LV[2][0])+dots(q.length,c)+`<div class="q"><button class="say" id="s" aria-label="Слушать">${ICO.say}</button><div class="t" style="font-size:clamp(22px,5.8vw,31px)">${esc(l)}</div></div><p class="hint">Кто это сказал? · Буни ким айтди?</p><div class="opts three">${os.map(o=>`<button class="opt" data-o="${o}" aria-label="${esc(t.w[o])}"><img src="${IM[t.k+'_w'+o]}" alt=""></button>`).join('')}</div><div class="msg" id="m"></div>`;
  wire(()=>tale(t));document.getElementById('s').onclick=()=>speak(l,p);speak(l,p);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;if(+b.dataset.o===a){lock=true;b.classList.add('good');beep(1);toast(t.w[a]);speak(t.w[a]+'! '+praise(),p);later(()=>{c++;c<q.length?r():finish(t,2,score(e),q[0][0])},1500)}else{e++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');beep(0);toast('Попробуй ещё!')}});
 }r();
}
/* 4 */
function order(t){clearT();let idx=shuf([0,1,2,3,4,5]);while(idx.every((v,i)=>v===i))idx=shuf(idx);let c=0,e=0;
 $.innerHTML=bar(LV[3][0])+`<p class="hint">Что было сначала? · Аввал нима бўлган?</p><div class="slots">${idx.map((_,i)=>`<div class="slot" id="sl${i}">${i+1}</div>`).join('')}</div><div class="scn">${idx.map(i=>`<button class="sc" data-i="${i}" aria-label="Картинка"><img src="${IM[t.k+'_p'+i]}" alt=""></button>`).join('')}</div><div class="msg" id="m"></div>`;
 wire(()=>tale(t));
 document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===c){beep(1);b.classList.add('used');const s=document.getElementById('sl'+c);s.className='slot f';s.innerHTML=`<img src="${IM[t.k+'_p'+i]}" alt="">`;speak(t.p6[i],t.v[i]);toast(t.p6[i]);c++;if(c===6)later(()=>finish(t,3,score(e),t.p6[5]),1900)}else{e++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');beep(0);toast('Попробуй ещё!')}});
}
/* 5 */
function build(t){clearT();const q=shuf([0,1,2,3,4,5]);let c=0,e=0;
 const split=s=>s.replace(/ — /g,' — ').split(' ');
 function r(){const i=q[c],ws=split(t.p6[i]);let bank=ws.map((w,j)=>({w,j}));do{bank=shuf(bank)}while(ws.length>1&&bank.every((x,j)=>x.j===j));let n=0;
  $.innerHTML=bar(LV[4][0])+dots(q.length,c)+`<div class="pic"><img src="${IM[t.k+'_p'+i]}" alt=""></div><div class="q" style="margin-bottom:10px"><button class="say" id="s" aria-label="Слушать">${ICO.say}</button></div><div class="line" id="ln"></div><div class="bank">${bank.map(x=>`<button class="tok" data-j="${x.j}">${esc(x.w)}</button>`).join('')}</div><div class="msg" id="m"></div>`;
  wire(()=>tale(t));document.getElementById('s').onclick=()=>speak(t.p6[i],t.v[i]);speak(t.p6[i],t.v[i]);
  document.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{if(+b.dataset.j===n){b.classList.add('used');const s=document.createElement('span');s.className='tok in';s.textContent=ws[n];document.getElementById('ln').appendChild(s);beep(1);n++;if(n===ws.length){speak(t.p6[i],t.v[i]);toast(praise());later(()=>{c++;c<q.length?r():finish(t,4,score(e),t.p6[5])},1500)}}else{e++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');beep(0)}});
 }r();
}
try{syn&&syn.getVoices();if(syn)syn.onvoiceschanged=()=>{}}catch(e){}
function route(){const h=location.hash.slice(1),t=D.find(x=>x.k===h);clearT();t?tale(t):home()}
window.addEventListener('hashchange',route);route();
/* unlock by link: …/skazki/?kod=XXXXXX */
(()=>{try{const P=new URLSearchParams(location.search),k=P.get('kod');if(k===null)return;P.delete('kod');const qs=P.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);if(!full)tryCode(k).then(ok=>{if(ok)route()}).catch(()=>{})}catch(e){}})();
</script></body></html>
