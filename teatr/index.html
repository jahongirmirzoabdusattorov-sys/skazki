<style>

ша", "Ой! На столе каша!"], ["Маша", "Вот большая миска. Какая большая!"], ["Рассказчик", "Маша взяла большую ложку."], ["Маша", "Горячо! Подую: фу-у-у!"], ["Маша", "А вот средняя миска."], ["Рассказчик", "Маша попробовала кашу."], ["Маша", "Холодно!"], ["Маша", "А вот маленькая миска."], ["Маша", "Вкусно! Очень вкусно!"], ["Рассказчик", "Маша съела кашу из маленькой миски."], ["Маша", "Ой! Каша закончилась. Что же я наделала?"]]}, {"t": "Стулья и кровати", "l": [["Маша", "Я устала. Хочу посидеть."], ["Маша", "Вот большой стул. Очень высокий!"], ["Маша", "Вот средний стул. Мне неудобно."], ["Маша", "А маленький стул мне подходит!"], ["Рассказчик", "Маша села. Скрипнул маленький стул."], ["Маша", "Ой! Стул сломался! Мне очень жаль."], ["Рассказчик", "Маша увидела три кровати."], ["Маша", "Большая кровать! Слишком большая."], ["Маша", "Средняя кровать. Нет, не подходит."], ["Маша", "Маленькая кровать. Как удобно!"], ["Рассказчик", "Маша закрыла глаза и уснула."], ["Рассказчик", "А медведи уже возвращались домой."]]}, {"t": "Знакомство и примирение", "l": [["Большой медведь", "Кто здесь был? Кто сидел на моём стуле?"], ["Средний медведь", "Кто ел мою кашу?"], ["Мишутка", "А моя миска пустая! И мой стул сломан!"], ["Рассказчик", "Медведи увидели Машу."], ["Мишутка", "Ой! Девочка! Ты кто?"], ["Маша", "Здравствуйте! Меня зовут Маша."], ["Большой медведь", "Как ты сюда попала?"], ["Маша", "Я заблудилась. Простите, я вошла без разрешения."], ["Маша", "Я съела кашу и сломала стул. Мне очень жаль."], ["Мишутка", "Я расстроился."], ["Маша", "Давайте я помогу всё убрать."], ["Средний медведь", "Спасибо, Маша. Вместе справимся."], ["Мишутка", "Давай дружить!"], ["Маша", "Давай! И помогите мне найти дорогу домой."], ["Рассказчик", "Медведи проводили Машу домой. Маша поблагодарила друзей."]]}, {"t": "Маша снова приходит в гости", "l": [["Рассказчик", "На другой день Маша пришла с разрешения взрослых."], ["Маша", "Тук-тук! Здравствуйте! Можно к вам?"], ["Мишутка", "Привет, Маша! Заходи, пожалуйста!"], ["Маша", "Спасибо. Я принесла вам яблоки."], ["Средний медведь", "Спасибо, Маша! Положи их на стол."], ["Маша", "А стул уже целый?"], ["Большой медведь", "Да, я починил маленький стул."], ["Маша", "Как хорошо! Можно я на него сяду?"], ["Мишутка", "Да, садись. Это мой маленький стул."], ["Маша", "А твой стул какой?"], ["Большой медведь", "Мой стул большой. Вот он."], ["Средний медведь", "А мой — средний. Давайте пить чай."], ["Маша", "Можно маленькую чашку, пожалуйста?"], ["Мишутка", "Вот твоя чашка. Осторожно, горячо!"], ["Маша", "Спасибо! Я подую. Теперь вкусно!"], ["Большой медведь", "Маша, ты помнишь, как приходят в гости?"], ["Маша", "Да! Сначала стучат и спрашивают разрешения."], ["Все", "А потом здороваются и говорят «спасибо»!"]]}]}, {"k": "mukha", "n": "Муха-Цокотуха", "c": "mukha_0", "pr": "mukha_2", "bg": "<svg viewBox=\"0 0 800 600\" preserveAspectRatio=\"xMidYMax slice\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"800\" height=\"600\" fill=\"#fde9c9\"/><path d=\"M60 40l30 60h-60z\" fill=\"#ec7a62\"/><path d=\"M180 40l30 60h-60z\" fill=\"#2bb0ba\"/><path d=\"M300 40l30 60h-60z\" fill=\"#f7c548\"/><path d=\"M420 40l30 60h-60z\" fill=\"#c58bd8\"/><path d=\"M540 40l30 60h-60z\" fill=\"#4caf6d\"/><path d=\"M660 40l30 60h-60z\" fill=\"#ec7a62\"/><path d=\"M780 40l30 60h-60z\" fill=\"#2bb0ba\"/><rect y=\"430\" width=\"800\" height=\"170\" fill=\"#d6b184\"/></svg>", "m": {"Муха": "mukha_0", "Пчела": "mukha_3", "Бабочка": "mukha_4", "Паук": "mukha_5", "Комарик": "mukha_6", "Продавец": "seller"}, "z": {"Комарик": 0.95, "Паук": 0.95}, "s": [{"t": "На базаре", "l": [["Рассказчик", "Муха гуляла и увидела монетку."], ["Муха", "Ой, что это? Монетка!"], ["Рассказчик", "Муха пошла на базар."], ["Муха", "Здравствуйте! У вас есть самовар?"], ["Продавец", "Здравствуйте! Да, вот самовар."], ["Муха", "Дайте, пожалуйста."], ["Продавец", "Возьмите, пожалуйста."], ["Муха", "Вот монетка. Спасибо!"], ["Продавец", "До свидания!"], ["Муха", "Сегодня я позову гостей!"]]}, {"t": "Гости за столом", "l": [["Муха", "Приходите в гости, друзья!"], ["Пчела", "Здравствуй, Муха! Я принесла мёд."], ["Муха", "Спасибо! Садись, пожалуйста."], ["Бабочка", "Здравствуй! А я принесла цветы."], ["Муха", "Какие красивые! Спасибо, Бабочка."], ["Пчела", "Можно мне чашку, пожалуйста?"], ["Муха", "Вот чашка. Будешь чай?"], ["Пчела", "Да, пожалуйста!"], ["Бабочка", "И мне чай, пожалуйста."], ["Муха", "Угощайтесь, друзья!"]]}, {"t": "Паук у двери", "l": [["Рассказчик", "К дому подошёл Паук."], ["Паук", "Я Паук. Вот моя паутина!"], ["Муха", "Паук, убери паутину, пожалуйста."], ["Паук", "Я закрыл ею дверь!"], ["Бабочка", "Ой, мы не можем выйти!"], ["Пчела", "Что же делать?"], ["Муха", "Друзья, помогите, пожалуйста!"], ["Рассказчик", "Комарик услышал Муху и подлетел к дому."], ["Комарик", "Я здесь! Где дверь?"]]}, {"t": "Комарик помогает", "l": [["Комарик", "Муха, я рядом! У меня есть фонарик."], ["Муха", "Посвети сюда, пожалуйста."], ["Комарик", "Вот и дверь! Паук, освободи проход!"], ["Рассказчик", "Паук увидел свет, убрал паутину и ушёл."], ["Бабочка", "Теперь дверь открыта!"], ["Пчела", "Спасибо, Комарик!"], ["Муха", "Садись к нам, пожалуйста. Будешь чай?"], ["Комарик", "Да, пожалуйста!"], ["Все", "Снова праздник! Давайте танцевать!"]]}, {"t": "Танец для друзей", "l": [["Муха", "Друзья, давайте танцевать!"], ["Бабочка", "Можно я начну?"], ["Муха", "Да, пожалуйста!"], ["Бабочка", "Машем крыльями!"], ["Пчела", "А теперь хлопаем! Раз, два, три!"], ["Комарик", "А теперь шаг вперёд и шаг назад!"], ["Муха", "Спасибо, что пришли!"], ["Все гости", "Спасибо за праздник, Муха!"], ["Все", "До свидания!"]]}]}, {"k": "aybolit", "n": "Айболит", "c": "aybolit_0", "pr": null, "bg": "<svg viewBox=\"0 0 800 600\" preserveAspectRatio=\"xMidYMax slice\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#bfe8f5\"/><stop offset=\"1\" stop-color=\"#eef9e6\"/></linearGradient></d function setMus(x){if(mg&&ac){mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setTargetAtTime(muted?0:.85*x,ac.currentTime,.18)}}
function startMusic(){if(mus||!musOn)return;try{ctx();mg=ac.createGain();mg.gain.value=muted?0:.85;mg.connect(ac.destination);mi=0;mn=ac.currentTime+.15;const st=.46;mus=setInterval(()=>{while(mn<ac.currentTime+.6){if(mi%8===0)CH[(mi/8)%4].forEach(f=>pad(f,mn,st*8+.6,.035,mg));if(mi%2===0||MEL[mi%32]!==MEL[(mi+31)%32])bell(MEL[mi%32],mn,1.3,.075,mg);mn+=st;mi++}},150)}catch(e){}}
function stopMusic(){clearInterval(mus);mus=null;if(mg){const g=mg;try{g.gain.setTargetAtTime(0,ac.currentTime,.15);setTimeout(()=>{try{g.disconnect()}catch(e){}},700)}catch(e){}mg=null}}
function fs(on){try{const d=document,el=d.documentElement;if(on){if(el.requestFullscreen&&!d.fullscreenElement)el.requestFullscreen().catch(()=>{})}else if(d.fullscreenElement)d.exitFullscreen().catch(()=>{})}catch(e){}}
const stop=()=>{gen++;clear();try{syn.cancel()}catch(e){}};
function bar(ti){return `<div class="top"><button class="ic" id="bk" aria-label="Назад">${IC.b}</button><div class="ttl">${ti}</div><button class="ic" id="mt" aria-label="Звук">${muted?IC.o:IC.s}</button></div>`}
function wire(b){E('bk').onclick=()=>{stop();b()};E('mt').onclick=()=>{muted=!muted;E('mt').innerHTML=muted?IC.o:IC.s;setMus(1);if(muted)try{syn.cancel()}catch(e){}}}
function home(){stop();stopMusic();fs(false);
 A.innerHTML=`<div class="hero"><h1>Кукольный театр</h1><p>Выбери сказку · Эртакни танла</p></div><div class="gr">${T.map((x,i)=>`<button class="po" data-i="${i}"><img src="${IM[x.c]}" alt=""><b>${x.n}</b></button>`).join('')}</div><button class="chip" id="vc">Овозни танлаш</button><div id="vl"></div><p class="note" id="nt"></p>`;
 document.querySelectorAll('.po').forEach(b=>b.onclick=()=>tale(T[+b.dataset.i]));
 E('vc').onclick=()=>{const l=E('vl'),v=ruV();if(l.innerHTML){l.innerHTML='';return}l.innerHTML=v.length?v.map((x,i)=>`<button class="vo${voice().name===x.name?' on':''}" data-i="${i}">${esc(x.name)}</button>`).join(''):'<p class="note">Бу қурилмада рус овози топилмади.</p>';l.querySelectorAll('.vo').forEach(b=>b.onclick=()=>{store.v=v[+b.dataset.i].name;save();l.querySelectorAll('.vo').forEach(y=>y.classList.remove('on'));b.classList.add('on');say('Здравствуйте! Начинаем сказку.','Рассказчик')})};
 const c=()=>{const n=E('nt');if(n&&(!syn||!voice()))n.textContent='Овоз чиқмаса, матн экранда кўринади: ўқитувчи ўқиб беради.'};c();later(c,1200);
}
function tale(x){stop();stopMusic();fs(false);t=x;const hs=Object.keys(x.m).filter(n=>x.m[n]);
 A.innerHTML=bar(x.n)+`<div class="po" style="padding:14px"><img src="${IM[x.c]}" alt="" style="height:130px"></div><button class="big" id="go">Смотреть спектакль</button><p class="sub" style="text-align:center">Қўғирчоқлар ўзи ўйнаб беради</p><h2>Я играю!</h2><p class="sub">Қаҳрамонни танла: унинг гапларини ўзинг айтасан</p><div class="rl">${hs.map(n=>`<button class="ro" data-n="${n}"><img src="${IM[x.m[n]]}" alt="">${n}</button>`).join('')}</div>`;
 wire(home);const unlock=()=>{fs(true);try{ctx();if(syn&&!muted){const u=new SpeechSynthesisUtterance(' ');u.volume=0;syn.speak(u)}}catch(e){}};
 E('go').onclick=()=>{unlock();role=null;show()};document.querySelectorAll('.ro').forEach(b=>b.onclick=()=>{unlock();role=b.dataset.n;show()});
}
function show(){stop();playing=true;
 A.innerHTML=`<div id="th"><div id="st"><div id="bg">${t.bg}</div>${t.pr?`<img id="pr" src="${IM[t.pr]}" alt="">`:''}<div id="cs"></div><div id="le"></div><div class="cu" id="cl"></div><div class="cu" id="cr"></div><div id="va"></div><div id="ti"></div><div id="br">Браво!</div><div class="ov"><button class="ic" id="bk" aria-label="Назад">${IC.b}</button><div><button class="ic" id="mu" aria-label="Музыка">${IC.m}</button><button class="ic" id="mt" aria-label="Звук">${muted?IC.o:IC.s}</button></div></div></div><div id="bt"><div id="pa"><img id="av" class="av0" alt=""><div><p id="nm"></p><p id="tx"></p></div></div><div id="tb"></div><div class="ct"><button class="cb" id="pv" aria-label="Назад">${IC.v}</button><button class="cb m" id="pl" aria-label="Пауза">${IC.h}</button><button class="cb" id="nx" aria-label="Дальше">${IC.n}</button><div class="ds">${t.s.map((_,i)=>`<button class="d" data-i="${i}">${i+1}</button>`).join('')}</div></div></div></div>`;
 E('mu').style.opacity=musOn?1:.45;E('mu').onclick=()=>{musOn=!musOn;store.m=musOn;save();E('mu').style.opacity=musOn?1:.45;musOn?startMusic():stopMusic()};
 startMusic();if(window.ResizeObserver){if(ro)ro.disconnect();ro=new ResizeObserver(()=>draw());ro.observe(E('st'))}
 wire(()=>tale(t));
 E('pl').onclick=()=>{playing=!playing;E('pl').innerHTML=playing?IC.h:IC.p;if(playing)next();else{gen++;clear();try{syn.cancel()}catch(e){}}};
 E('nx').onclick=()=>next();E('pv').onclick=()=>{ln=Math.max(-1,ln-2);next()};
 document.querySelectorAll('.d').forEach(b=>b.onclick=()=>scene(+b.dataset.i));
 scene(0);
}
const hero=n=>t.m[n]?n:null;
function W(){const w=E('st').clientWidth;return w}
function maxC(){return W()<560?3:4}
function draw(group){const box=E('cs');if(!box)return;const have=new Map([...box.children].map(e=>[e.dataset.n,e]));
 have.forEach((e,n)=>{if(!cast.includes(n)){e.classList.add('out');setTimeout(()=>e.remove(),520)}});
 const n=cast.length,cw=box.clientWidth,ch=box.clientHeight,base=n>4?21:n>3?26:n>2?32:n>1?40:48,land=cw>ch,bw=Math.min(cw*base/100*(land?.8:1),ch*.62);
 cast.forEach((c,i)=>{let e=have.get(c);const left=(100/(n+1))*(i+1)*(t.pr&&n<3?.86:1);
  if(!e){e=document.createElement('div');e.className='pu out';e.dataset.n=c;e.style.left=left+'%';e.innerHTML=`<img src="${IM[t.m[c]]}" alt="${c}">`;box.appendChild(e);void e.offsetWidth;e.classList.remove('out')}
  const w=bw*(t.z[c]||1);e.classList.remove('out');e.style.left=left+'%';e.style.width=w+'px';e.style.height=w+'px';e.style.marginLeft=-w/2+'px'});
}
function talk(names){document.querySelectorAll('.pu').forEach(e=>e.classList.toggle('t',names.includes(e.dataset.n)))}
function dots(){document.querySelectorAll('.d').forEach((b,i)=>b.classList.toggle('on',i===sc))}
function scene(i){stop();sc=i;ln=-1;cast=[];draw();dots();talk([]);E('st').classList.remove('op');E('ti').textContent=t.s[i].t;E('tb').innerHTML='';E('pa').className='';E('av').className='av0';E('nm').textContent='';E('tx').textContent='';
 const g=gen;later(()=>{tune([523,659,784,1047],.13);E('st').classList.add('op')},1100);if(playing)later(()=>{if(g===gen&&playing)next()},2300)}
function next(){stop();const L=t.s[sc].l;ln++;if(ln>=L.length){if(sc+1<t.s.length){scene(sc+1)}else end();return}line(L[ln])}
function line(l){const[n,tx]=l,g=gen;E('st').classList.add('op');let names=[],group=false;
 if(n==='Рассказчик'){}
 else if(hero(n)){if(!cast.includes(n)){if(cast.length>=maxC())cast.shift();cast.push(n)}names=[n]}
 else{group=true;const all=[...new Set(t.s[sc].l.map(x=>x[0]).filter(hero))];cast=(n==='Дед и Баба'?['Дед','Баба']:n==='Все медведи'?['Большой медведь','Средний медведь','Мишутка']:all).slice(0,5);names=cast.slice()}
 draw(group);talk(names);
 const pa=E('pa'),av=E('av');E('nm').textContent=n==='Рассказчик'?'Рассказчик':n;E('tx').textContent=tx;
 if(hero(n)){av.src=IM[t.m[n]];av.className=''}else av.className='av0';
 pa.className='';E('tb').innerHTML='';
 if(role&&n===role){pa.className='turn';E('nm').textContent='Твоя очередь! Сен айт:';E('tb').innerHTML='<div class="tb"><button class="bt alt" id="hp">Подсказка</button><button class="bt" id="dn">Сказал!</button></div>';
  E('hp').onclick=()=>say(tx,n);E('dn').onclick=()=>{playing=true;E('pl').innerHTML=IC.h;next()};return}
 say(tx,n,()=>{if(g===gen&&playing)later(()=>{if(g===gen&&playing)next()},380)});
}
function end(){stop();talk([]);E('st').classList.remove('op');E('ti').textContent='';later(()=>{E('br').style.display='grid';clap();tune([523,659,784,1047,784,1047,1319],.15);E('tx').textContent='Спасибо! До новых встреч!';E('nm').textContent='';E('av').className='av0';E('pa').className='';E('tb').innerHTML='<div class="tb"><button class="bt alt" id="ag">Ещё раз</button><button class="bt" id="ho">К сказкам</button></div>';E('ag').onclick=show;E('ho').onclick=home;for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=['#f7c548','#2bb0ba','#ec7a62','#4caf6d'][i%4];c.style.animationDelay=Math.random()*.9+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}},800)}
try{syn&&syn.getVoices()}catch(e){}
function route(){const h=location.hash.slice(1),x=T.find(q=>q.k===h);x?tale(x):home()}
window.addEventListener('hashchange',route);route();
</script></body></html>
