<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B6477">
<title>Leadership Learning House — to'lovlar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column ledger, month summary first, bottom tab bar */
:root{
  --bg:#F2F5F4;--card:#FFFFFF;--ink:#14262B;--mute:#5C6F74;--line:#DCE4E3;--accent:#0B6477;--on:#FFFFFF;
  --good:#1B7A4B;--goodbg:#DFF3E7;--warn:#8F5F00;--warnbg:#FCEFCF;--bad:#B3322C;--badbg:#FBE3E1;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1D;--card:#182629;--ink:#E7EEEE;--mute:#9BADB0;--line:#2B3C40;--accent:#5CC0D4;--on:#08262D;
  --good:#6FD39E;--goodbg:#143325;--warn:#EBC069;--warnbg:#3A2C0C;--bad:#F39A93;--badbg:#401C1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1D;--card:#182629;--ink:#E7EEEE;--mute:#9BADB0;--line:#2B3C40;--accent:#5CC0D4;--on:#08262D;
  --good:#6FD39E;--goodbg:#143325;--warn:#EBC069;--warnbg:#3A2C0C;--bad:#F39A93;--badbg:#401C1A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);padding-bottom:84px;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sublink{background:none;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;text-align:left;font-weight:600;color:var(--accent);width:100%}
.course{border-top:1px solid var(--line)}
.course:first-child{border-top:0}
.course .check{border-top:0}
.course .sub{display:flex;flex-wrap:wrap;gap:8px;padding:0 10px 10px 40px;align-items:flex-end}
.course .sub label{flex:1 1 100px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.course .sub input,.course .sub select{min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;width:100%}
.course .sub .dh{flex:1 1 100%;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.course .sub .dh>div{display:flex;flex-wrap:wrap;gap:6px}
.course .sub .dd{flex:1 1 124px;display:flex;flex-direction:column;gap:3px}
.stp{display:flex;gap:4px}
.stp button{flex:none;width:40px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:18px}
.course .sub .stp input{flex:1;min-width:0;text-align:center;padding:0 2px}
.tb{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:560px}
.tb th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tb td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.tb tbody tr:hover{background:var(--bg)}
.month{display:flex;align-items:center;justify-content:space-between}
.month h1{font-size:20px;font-weight:700}
.icon{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:18px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sum .big{font-size:26px;font-weight:700;color:var(--bad)}
.sum .big.ok{color:var(--good)}
.lbl{font-size:12.5px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.val{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{flex:1 1 140px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:19px;background:var(--card)}
.seg button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.ghead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 2px 0}
.ghead h2{font-size:15px;font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.row:first-child{border-top:0}
.row>div:first-child{min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.right{text-align:right;flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:600}
.pill.good{color:var(--good);background:var(--goodbg)}
.pill.warn{color:var(--warn);background:var(--warnbg)}
.pill.bad{color:var(--bad);background:var(--badbg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:16px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.date{width:40px;height:40px;border:1px solid var(--line);background:none;border-radius:8px;padding:0}
.date.x{text-decoration:line-through;color:var(--bad);background:var(--badbg);border-color:transparent}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.del{color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.empty{padding:24px 16px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{font-size:13px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:160px;height:60px;border:0;background:none;color:var(--mute);font-weight:500;font-size:11px;padding:0}
nav button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:18px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.f input,label.f select{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;width:100%}
label.f textarea{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
label.btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.calc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.calc div{display:flex;justify-content:space-between;gap:8px}
.calc .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
/* Kirish oynasi */
body.out nav{display:none}
body.out{padding-bottom:0}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#login[hidden]{display:none}
#login form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#login h1{font-size:20px;line-height:1.25}
#login h1 span{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:4px}
.err{color:var(--bad);font-size:13.5px}
.err:empty{display:none}
@media (min-width:768px){
  body{font-size:16px}
  main{max-width:960px;padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  main>*{grid-column:1/-1}
  main>article.card{grid-column:auto}
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:88%}
  nav button{font-size:14px;max-width:190px}
}
.brand{display:none}
@media (min-width:768px) and (max-width:1023px){
  nav button{height:64px;font-size:15px}
  body{padding-bottom:90px}
}
@media (min-width:1024px){
  body{padding:0 0 0 232px}
  body.out{padding:0}
  nav{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line)}
  .brand{display:block;font-weight:700;font-size:17px;line-height:1.25;padding:4px 12px 18px;color:var(--ink)}
  .brand span{display:block;font-size:12.5px;font-weight:500;color:var(--mute);margin-top:2px}
  nav button{flex:none;max-width:none;width:100%;height:46px;text-align:left;padding:0 14px;border-radius:10px;font-size:15px}
  nav button:hover{background:var(--bg)}
  nav button.on{box-shadow:none;background:var(--accent);color:var(--on)}
  main{max-width:1180px;margin:0 auto;padding:28px 32px;grid-template-columns:repeat(3,1fr)}
  .month h1{font-size:24px}
  .row:hover{background:var(--bg)}
  .sheet{max-width:620px;padding:22px}
  #toast{bottom:24px}
}
#toast{position:fixed;left:16px;right:16px;bottom:76px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;z-index:30;text-align:center}
</style>
</head>
<body class="out">
<main id="app"><p class="note">Yuklanmoqda…</p></main>
<nav aria-label="Bo'limlar">
  <div class="brand">O'quv markaz<span>To'lovlar va hisob</span></div>
  <button id="t-pay" onclick="go('pay')">To'lovlar</button>
  <button id="t-led" onclick="go('led')">Qabul</button>
  <button id="t-att" onclick="go('att')">Yo'qlama</button>
  <button id="t-grp" onclick="go('grp')">Guruhlar</button>
  <button id="t-stu" onclick="go('stu')">O'quvchilar</button>
  <button id="t-tch" onclick="go('tch')">Ustozlar</button>
</nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div id="login" hidden><form onsubmit="return doLogin(event)" novalidate>
  <h1>Leadership Learning House<span>To'lovlar va hisob</span></h1>
  <p class="note">Rahbar bergan email va parol bilan kiring.</p>
  <label class="f">Email<input id="auE" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
  <label class="f">Parol<input id="auP" type="password" autocomplete="current-password"></label>
  <p class="err" id="auErr" role="alert"></p>
  <button class="btn pri wide" id="auBtn">Kirish</button>
</form></div>
<div id="toast" role="status"></div>
<script>
const MONTHS=["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];
const DAYS=[[1,"Du"],[2,"Se"],[3,"Cho"],[4,"Pa"],[5,"Ju"],[6,"Sha"],[0,"Yak"]];
const S={groups:{},students:{},payments:{},teachers:{},salaries:{},settings:{},leads:{}};
let C={};
let db=null,view="pay",loaded=false;
const now=new Date();
let month=now.getFullYear()+"-"+pad(now.getMonth()+1);
let F={q:"",g:"",st:"all",mode:"tbl"};let SV={tab:"list",q:"",g:"",old:false};

function pad(n){return String(n).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function num(s){return parseInt(String(s).replace(/\D/g,""),10)||0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mName(m){const[y,mo]=m.split("-");return MONTHS[mo-1]+" "+y}
function today(){return now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())}
function shift(m,d){let[y,mo]=m.split("-").map(Number);const t=new Date(y,mo-1+d,1);return t.getFullYear()+"-"+pad(t.getMonth()+1)}

/* ---- Hisob-kitob ---- */
function version(g,m){
  const v=[...(g.versions||[])].sort((a,b)=>a.from<b.from?-1:1);
  let c=v[0];for(const x of v)if(x.from<=m)c=x;return c;
}
function lessonDates(g,m){
  const v=version(g,m),[y,mo]=m.split("-").map(Number),n=new Date(y,mo,0).getDate(),out=[];
  for(let d=1;d<=n;d++){if(v.days.includes(new Date(y,mo-1,d).getDay()))out.push(m+"-"+pad(d))}
  return out;
}
function activeDates(g,m){const c=g.cancelled||[];return lessonDates(g,m).filter(d=>!c.includes(d))}
function roundSum(x){return Math.round(x/1000)*1000}
/* Asosiy qoida: oylik narx paket darslari uchun; har bir dars = narx / paket */
function calc(price,pack,n){
  if(n===pack)return{total:price,extra:0,one:roundSum(price/pack)};
  if(n>pack){const extra=n-pack;return{total:roundSum(price+price/pack*extra),extra,one:roundSum(price/pack)}}
  return{total:roundSum(price/pack*n),extra:0,one:roundSum(price/pack)};
}
function bill(s,g,m,gid){
  const cs0=courseStart(s,gid),v=version(g,m),all=activeDates(g,m).filter(x=>(!cs0||x>=cs0)&&(!s.end||x<=s.end));
  const miss=(s.absent&&s.absent[gid])||[],d=all.filter(x=>!miss.includes(x));
  const r=calc(v.price,v.pack,d.length);
  return Object.assign(r,{n:d.length,price:v.price,pack:v.pack,all,miss,abs:all.length-d.length});
}
function paysFor(sid,gid,m){
  if(!C.pay){C.pay={};for(const[id,p]of Object.entries(S.payments)){const k=p.sid+"|"+p.gid+"|"+p.month;(C.pay[k]=C.pay[k]||[]).push(Object.assign({id},p))}}
  return C.pay[sid+"|"+gid+"|"+m]||[];
}
function setts(m){const st=S.settings.main;return st&&st.versions?version(st,m):{family:5,multi:10}}
function trackFrom(){const st=S.settings.main;return st&&st.trackFrom||"2026-11"}
/* O'quvchining shu oydagi kurslari: {guruhId: chegirma foizi} */
function stuCourses(s,m){
  if(s.versions&&s.versions.length)return version(s,m).groups||{};
  const o={};(s.groupIds||[]).forEach(g=>o[g]=null);return o;
}
/* O'quvchining oxirgi to'lov sanasi va summasi */
function lastPay(sid){
  let b=null;for(const p of Object.values(S.payments))if(p.sid===sid&&p.date&&(!b||p.date>b.date))b=p;
  return b;
}
function lastTxt(sid){const p=lastPay(sid);return p?`oxirgi to'lov ${fmtD(p.date)}`:"to'lov yo'q"}
/* ---- Telegram bot ---- */
function botName(){const st=S.settings.main;return st&&st.bot||""}
function tgCount(s){return s&&s.tg?Object.keys(s.tg).length:0}
function tgLink(sid){return "https://t.me/"+botName()+"?start="+sid}
function tgSheet(sid){
  const s=S.students[sid],n=tgCount(s);
  if(!botName()){openSheet(`<h2>Telegram bot</h2><p class="note">Avval bot ochib, uning nomini <b>O'quvchilar → Sozlamalar</b>dagi "Telegram bot nomi" maydoniga yozing.</p><button class="btn wide" onclick="closeSheet()">Yopish</button>`);return}
  const link=tgLink(sid),txt=`Assalomu alaykum! ${s.name}ning to'lov kunlari va qarzi haqidagi eslatmalarni Telegramda olish uchun shu havolani oching va "Start" (Запустить) tugmasini bosing:\n${link}${center()?"\n\nHurmat bilan, "+center():""}`;
  const ph=phoneIntl(s.phone),e=encodeURIComponent(txt);
  openSheet(`<h2>Telegram: ${esc(s.name)}</h2>
  <div class="calc"><div><span>Ulangan ota-onalar</span><span>${n?Object.values(s.tg).map(x=>esc(x.name||"")).join(", ")||n:"hali yo'q"}</span></div></div>
  <p class="note">Havolani ota-onaga bir marta yuboring. U "Start"ni bosgach, bot shu bolaga ulanadi va har kuni ertalab kerak bo'lganda o'zi xabar yuboradi. Ulanish 1 soat ichida ko'rinadi.</p>
  <label class="f">Xabar matni<textarea id="mt" rows="5" style="padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px">${esc(txt)}</textarea></label>
  <button class="btn pri wide" onclick="copyMsg()">Matnni nusxalash</button>
  <div class="acts"><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt.replace(link,""))}" target="_blank" rel="noopener">Telegram</a>${ph?`<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://wa.me/${ph}?text=${e}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>
  <button class="btn wide" onclick="stuSheet('${sid}')">Orqaga</button>`);
}
/* Kurs bo'yicha boshlagan sana: o'quvchi ikkinchi kursga oy o'rtasida yozilsa, shu kundan sanaladi */
function courseStart(s,gid){const a=s.start||"",b=s.cstart&&s.cstart[gid]||"";return a>b?a:b}
/* Chegirma tarixi: o'zgargan kundan keyin boshlanadigan to'lovlarga qo'llanadi */
function discAt(s,gid,date){const L=s.dh&&s.dh[gid];if(!L||!L.length)return null;let p=null;for(const x of L.slice().sort((a,b)=>a.from<b.from?-1:1))if(x.from<=date)p=x.pct;return p}
function famKey(s){return(s.family||"").trim().toLowerCase()}
function discount(s,count,famCount,set){
  if(s.disc!==undefined&&s.disc!==null&&s.disc!=="")return{pct:+s.disc,why:"alohida"};
  const a=count>=2?set.multi:0,b=famCount>=2?set.family:0;
  if(!a&&!b)return{pct:0,why:""};
  return a>=b?{pct:a,why:"2 ta kurs"}:{pct:b,why:"oila"};
}
function billMode(){const st=S.settings.main;return st&&st.mode||"cycle"}
function center(){const st=S.settings.main;return st&&st.center!==undefined?st.center:"Leadership Learning House"}
function fmtD(d){return +d.slice(8)+"."+d.slice(5,7)}
/* 12 darslik davrlar: o'quvchi kelgan kunidan sanaladi, kelmagan dars sanalmaydi */
/* To'lov kuni bog'langan kurs (oila yoki o'quvchining boshqa kursi): shu kursning 12 darsi boshlangan kun
   hammasi uchun umumiy to'lov kuni bo'ladi, bog'langan kurs esa shu oraliqdagi darslari soniga qarab hisoblanadi */
function anchorOf(sid,gid){
  const s=S.students[sid],a=s&&s.anchor;if(!a||a===sid+"|"+gid)return null;
  const[as,ag]=a.split("|"),x=S.students[as];
  if(!x||!S.groups[ag])return null;
  return[as,ag];
}
function cycles(sid,gid,m){
  const an=anchorOf(sid,gid);
  if(!an)return baseCycles(sid,gid,m);
  const s=S.students[sid],g=S.groups[gid],key="z"+sid+"|"+gid+"|"+m;
  if(C[key])return C[key];
  const st=courseStart(s,gid)||trackFrom()+"-01",ac=baseCycles(an[0],an[1],m),out=[];
  if(!ac.length)return C[key]=baseCycles(sid,gid,m);
  const own=[],last=ac[ac.length-1].next||ac[ac.length-1].last;
  for(let mm=st.slice(0,7);mm<=last.slice(0,7);mm=shift(mm,1)){
    if(!(gid in stuCourses(s,mm)))continue;
    for(const d of activeDates(g,mm))if(d>=st&&(!s.end||d<=s.end))own.push(d);
  }
  /* Asosiy kurs boshlanishidan oldingi darslar: birinchi to'lov o'quvchining birinchi darsida */
  const pre=own.filter(d=>d<ac[0].start);
  if(pre.length)out.push({start:pre[0],last:pre[pre.length-1],n:pre.length,pack:version(g,pre[0].slice(0,7)).pack,anch:true});
  for(const c of ac){
    const ch=own.filter(d=>d>=c.start&&(c.next?d<c.next:d<=c.last));
    if(!ch.length)continue;
    out.push({start:c.start<st?ch[0]:c.start,last:ch[ch.length-1],n:ch.length,pack:version(g,ch[0].slice(0,7)).pack,anch:true});
  }
  out.forEach((c,i)=>{c.k=i+1;c.next=out[i+1]?out[i+1].start:""});
  return C[key]=out;
}
function baseCycles(sid,gid,m){
  const s=S.students[sid],g=S.groups[gid],tm=today().slice(0,7),hz=shift(m>tm?m:tm,4),key="y"+sid+"|"+gid+"|"+hz;
  if(C[key])return C[key];
  const st=courseStart(s,gid)||trackFrom()+"-01",miss=(s.absent&&s.absent[gid])||[],dates=[];
  for(let mm=st.slice(0,7);mm<=hz;mm=shift(mm,1)){
    if(!(gid in stuCourses(s,mm)))continue;
    for(const d of activeDates(g,mm))if(d>=st&&(!s.end||d<=s.end))dates.push(d);
  }
  const out=[];
  for(let i=0,k=1;i<dates.length;k++){const pack=version(g,dates[i].slice(0,7)).pack,ch=dates.slice(i,i+pack);out.push({k,start:ch[0],last:ch[ch.length-1],n:ch.length,pack});i+=pack}
  out.forEach((c,i)=>c.next=out[i+1]?out[i+1].start:"");
  return C[key]=out;
}
function cycleBill(sid,s,g,gid,c){
  /* Kelmagan dars davrni surmaydi: shu dars narxi summadan ayiriladi */
  const v=version(g,c.start.slice(0,7)),n=c.anch||s.end?c.n:c.pack,all=[];
  for(let mm=c.start.slice(0,7);mm<=c.last.slice(0,7);mm=shift(mm,1))
    for(const d of activeDates(g,mm))if(d>=c.start&&d<=c.last&&(!s.end||d<=s.end))all.push(d);
  const miss=((s.absent&&s.absent[gid])||[]).filter(d=>all.includes(d));
  /* Har bir dars o'z oyining narxida: oktabrdagi darslar oktabr narxida, noyabrdagilari noyabr narxida */
  const one=d=>{const x=version(g,d.slice(0,7));return x.price/x.pack};
  const L=all.slice(0,n);while(L.length<n)L.push(L.length?L[L.length-1]:c.start);
  const split={};for(const d of L){const mm=d.slice(0,7);split[mm]=split[mm]||{m:mm,n:0,one:one(d)};split[mm].n++}
  const fullX=L.reduce((a,d)=>a+one(d),0),absX=miss.reduce((a,d)=>a+one(d),0);
  const full=roundSum(fullX),r={total:roundSum(Math.max(0,fullX-absX)),one:roundSum(v.price/c.pack)};
  return Object.assign(r,{full,absSum:full-r.total,split:Object.values(split),anch:!!c.anch,extra:0,n:c.n,price:v.price,pack:c.pack,all,miss,abs:miss.length,k:c.k,cyc:c.start,last:c.last,next:c.next});
}
function cyPays(sid,gid,cs,k){
  const key="q"+sid+"|"+gid;
  if(!C[key]){C[key]={};
    for(const[id,p]of Object.entries(S.payments)){
      if(p.sid!==sid||p.gid!==gid)continue;
      let kk=p.cyc;
      if(kk===undefined){const L=cs.filter(c=>c.start<=(p.date||p.month+"-31"));kk=L.length?L[L.length-1].k:(cs[0]?cs[0].k:0)}
      (C[key][kk]=C[key][kk]||[]).push(Object.assign({id},p));
    }}
  return C[key][k]||[];
}
function rows(m){
  if(C["r"+m])return C["r"+m];
  const set=setts(m),count={},fam={},out=[];
  for(const[sid,s]of Object.entries(S.students)){
    for(const gid of Object.keys(stuCourses(s,m))){const g=S.groups[gid];if(g&&bill(s,g,m,gid).n>0)count[sid]=(count[sid]||0)+1}
    if(count[sid]&&famKey(s))fam[famKey(s)]=(fam[famKey(s)]||0)+1;
  }
  for(const[sid,s]of Object.entries(S.students))for(const[gid,own]of Object.entries(stuCourses(s,m))){
    const g=S.groups[gid];if(!g)continue;
    const d=own!==null&&own!==undefined?{pct:+own,why:"kurs chegirmasi"}:discount(s,count[sid]||0,fam[famKey(s)]||0,set);
    const push=(b,ps,due)=>{const paid=ps.reduce((a,p)=>a+p.amount,0);
      const hp=discAt(s,gid,b.cyc||m+"-01"),dd=hp===null?d:{pct:+hp,why:"kurs chegirmasi"};
      b.gross=b.total;b.pct=dd.pct;b.why=dd.why;b.disc=roundSum(b.gross*dd.pct/100);b.total=b.gross-b.disc;
      out.push({sid,gid,s,g,b,m,paid,due,left:Math.max(0,b.total-paid),st:paid>=b.total?"paid":paid>0?"part":due?"debt":"soon"})};
    if(billMode()==="cycle"){
      const cs=cycles(sid,gid,m);
      for(const c of cs)if(c.start.slice(0,7)===m)push(cycleBill(sid,s,g,gid,c),cyPays(sid,gid,cs,c.k),c.start<=today());
      continue;
    }
    const b=bill(s,g,m,gid),ps=paysFor(sid,gid,m);
    if(b.n===0&&!ps.length&&!b.abs)continue;
    push(b,ps,true);
  }
  out.sort((a,b)=>a.g.name.localeCompare(b.g.name)||a.s.name.localeCompare(b.s.name));
  /* Ortiqcha to'lov keyingi oyga o'tadi */
  const tf=trackFrom();let carry={};
  if(m>tf){const pm=shift(m,-1);rows(pm);carry=C["c"+pm]||{}}
  const next=Object.assign({},carry);
  for(const r of out){
    r.credit=0;r.over=Math.max(0,r.paid-r.b.total);
    if(m<tf)continue;
    const use=Math.min(next[r.sid]||0,r.left);
    if(use>0){r.credit=use;r.left-=use;next[r.sid]-=use;const eff=r.paid+use;r.st=eff>=r.b.total?"paid":r.due?"part":"soon"}
  }
  if(m>=tf){for(const r of out)if(r.over)next[r.sid]=(next[r.sid]||0)+r.over;C["c"+m]=next}
  return C["r"+m]=out;
}
function got(r){return Math.min(r.paid,r.b.total)+r.credit}
function creditOut(sid,m){rows(m);return(C["c"+m]||{})[sid]||0}
function byStu(m){
  if(C["b"+m])return C["b"+m];
  const o={};rows(m).forEach(r=>(o[r.sid]=o[r.sid]||[]).push(r));
  return C["b"+m]=o;
}
/* O'quvchining shu oydagi va oldingi oylardagi qarzi */
function debt(sid,upto){
  const s=S.students[sid],cur=(byStu(upto)[sid]||[]).filter(r=>r.due),prev=[];
  let m=trackFrom();
  if(s.start&&s.start.slice(0,7)>m)m=s.start.slice(0,7);
  for(;m<upto;m=shift(m,1))(byStu(m)[sid]||[]).forEach(r=>{if(r.left>0&&r.due)prev.push(r)});
  const sum=L=>L.reduce((a,r)=>a+r.left,0);
  return{cur,prev,curLeft:sum(cur),prevLeft:sum(prev),total:sum(cur)+sum(prev)};
}
/* O'qituvchi oyligi */
function tTerms(t,m){
  const v=version(t,m);
  if(v.courses)return v.courses;
  const o={};let first=true;
  for(const[gid,g]of Object.entries(S.groups)){
    if(!t.id||g.teacherId!==t.id)continue;
    o[gid]=v.type==="fixed"?{type:"fixed",rate:first?v.rate:0}:{type:v.type,rate:v.rate,pct:v.pct,base:v.base};first=false;
  }
  return o;
}
/* Har bir hafta kuni uchun ustozning o'z soati */
function tHours(c,g,m){
  const gv=version(g,m),per={};let h=0;
  for(const d of activeDates(g,m)){
    const[y,mo,x]=d.split("-").map(Number),w=new Date(y,mo-1,x).getDay();
    const e=c.dayHours&&c.dayHours[w]!==undefined?c.dayHours[w]:(c.hours||gv.hours||1.5);
    per[w]=per[w]||{n:0,e};per[w].n++;h+=e;
  }
  h=Math.round(h*100)/100;
  return{h,txt:DAYS.filter(([w])=>per[w]).map(([w,l])=>`${l} ${per[w].n}×${per[w].e}`).join(", ")};
}
/* Guruhning shu oydagi ulushi: 12 darslik davr oylarga bo'linsa (masalan oktabrda 4, noyabrda 8 dars),
   summa darslar soniga qarab oylarga taqsimlanadi */
function groupMonth(gid,m){
  if(billMode()!=="cycle")return rows(m).filter(r=>r.gid===gid).map(r=>({r,f:1,n:r.b.n}));
  const out=[];
  for(let k=-4;k<=0;k++)for(const r of rows(shift(m,k))){
    if(r.gid!==gid)continue;
    const all=r.b.all||[],inM=all.filter(d=>d.slice(0,7)===m).length;
    if(all.length&&inM)out.push({r,f:inM/all.length,n:inM});
  }

}
function teacherPay(tid,t,m){
  const lines=[];let total=0;

    }

  for(const col of cols){
    db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>o[d.id]=d.data());S[col]=o;pending.delete(col);
      if(!pending.size){clearTimeout(timer);loaded=true}
      if(loaded)render();

/* ---- Oylik hisobot ---- */
function teacherDebt(tid,t,upto){
  let sum=0;
  for(let m=trackFrom();m<=upto;m=shift(m,1)){
    const pay=teacherPay(tid,t,m).total,given=salaryPaid(tid,m).reduce((a,x)=>a+x.amount,0);
    sum+=Math.max(0,pay-given);
  }
  return sum;
}
function report(m){
  const R=rows(m),byName=(a,b)=>a.name.localeCompare(b.name);
  const debtors=Object.keys(S.students).map(sid=>Object.assign({sid,name:S.students[sid].name,phone:S.students[sid].phone},debt(sid,m))).filter(x=>x.total>0).sort(byName);
  const credits=Object.keys(S.students).map(sid=>({sid,name:S.students[sid].name,sum:creditOut(sid,m)})).filter(x=>x.sum>0).sort(byName);
  const staff=Object.entries(S.teachers).map(([id,t])=>({id,name:t.name,sum:teacherDebt(id,t,m)})).filter(x=>x.sum>0).sort(byName);
  const add=(L,k)=>L.reduce((a,x)=>a+x[k],0);
  const billed=R.reduce((a,r)=>a+r.b.total,0),income=R.reduce((a,r)=>a+got(r),0);
  const salary=Object.entries(S.teachers).reduce((a,[id,t])=>a+teacherPay(id,t,m).total,0);
  return{debtors,credits,staff,billed,income,salary,owed:add(debtors,"total"),weOweStaff:add(staff,"sum"),weOweCredit:add(credits,"sum")};
}

  const r=report(month),we=r.weOweStaff+r.weOweCredit,net=r.income-r.salary;
  const sec=(t,L)=>L?`<div class="ghead"><h2>${t}</h2></div><div class="list">${L}</div>`:"";

function dshift(d,n){const[y,m,x]=d.split("-").map(Number),t=new Date(y,m-1,x+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function dLabel(d){const[y,m,x]=d.split("-").map(Number);return WEEK[new Date(y,m-1,x).getDay()]+", "+x+" "+MONTHS[m-1].toLowerCase()}
function groupsOn(d){const m=d.slice(0,7);return Object.entries(S.groups).filter(([,g])=>activeDates(g,m).includes(d)).sort((a,b)=>(a[1].time||"").localeCompare(b[1].time||"")||a[1].name.localeCompare(b[1].name))}
function attList(gid,d){const m=d.slice(0,7);return Object.entries(S.students).filter(([,s])=>gid in stuCourses(s,m)&&(!courseStart(s,gid)||d>=courseStart(s,gid))&&(!s.end||d<=s.end)).sort((a,b)=>a[1].name.localeCompare(b[1].name))}
function isAbs(s,gid,d){return((s.absent&&s.absent[gid])||[]).includes(d)}
function flipAbs(sid,gid,d){const s=S.students[sid],a=Object.assign({},s.absent||{}),c=new Set(a[gid]||[]);c.has(d)?c.delete(d):c.add(d);a[gid]=[...c];put("students",sid,Object.assign({},s,{absent:a}))}

function payInfo(sid,gid){

  const cur=[...cs].reverse().find(c=>c.start<=t)||null,nx=cs.find(c=>c.start>t)||null;

}
function dueOn(gid,d){

function saveStu(id){
  const name=document.getElementById("sn").value.trim();
  if(!name){toast("Ism va familiyani kiriting");return}
  const btn=document.getElementById("ssave"),low=name.toLowerCase();
  if(!id&&!btn.dataset.a&&Object.values(S.students).some(x=>x.name.trim().toLowerCase()===low)){btn.dataset.a=1;btn.textContent="Baribir saqlash";toast("Bu ism allaqachon bor. Mavjud o'quvchiga kurs qo'shing.");return}
  const old=id?S.students[id]:null;
  /* Xodim mavjud o'quvchida faqat ism, telefon va sanalarni o'zgartiradi (kurs va chegirma — rahbarniki) */
  if(old&&!own()){
    put("students",id,Object.assign({},old,{name,phone:document.getElementById("sp").value.trim(),phone2:document.getElementById("sp2").value.trim(),parent:document.getElementById("spn").value.trim(),start:document.getElementById("ss").value,end:document.getElementById("se").value}));
    closeSheet();return;
  }
  const groups={},prev=old?stuCourses(old,month):{};
  for(const i of document.querySelectorAll("#sg input[type=checkbox]:checked")){
    const inp=document.querySelector(`#sg input[data-g="${i.value}"]`);
    /* Xodim chegirmani o'zgartirmaydi: mavjud kursda eskisi qoladi, yangisida 0 */
    if(!inp){groups[i.value]=i.value in prev?prev[i.value]:0;continue}
    const raw=inp.value.trim().replace(",","."),p=raw===""?0:parseFloat(raw);
    if(!(p>=0&&p<=100)){toast("Chegirma 0 dan 100 gacha bo'lsin");return}
    groups[i.value]=p;
  }
  let versions;
  if(!old)versions=[{from:"2000-01",groups}];
  else{
    const base=old.versions&&old.versions.length?old.versions:[{from:"2000-01",groups:stuCourses(old,month)}];
    versions=[...base.filter(x=>x.from!==month),{from:month,groups}];
  }
  const newSid=id||uid(),cd=(document.getElementById("scd")||{}).value||today();
  const cstart=Object.assign({},old&&old.cstart||{}),dh=JSON.parse(JSON.stringify(old&&old.dh||{}));
  if(old)for(const g of Object.keys(groups)){
    if(!(g in prev)){cstart[g]=cd;dh[g]=[{from:cd,pct:groups[g]}];continue}
    const was=discAt(old,g,cd),wasP=was===null?(+prev[g]||0):was;
    if(+groups[g]!==wasP){if(!dh[g]||!dh[g].length)dh[g]=[{from:"2000-01-01",pct:+prev[g]||0}];dh[g]=dh[g].filter(x=>x.from!==cd);dh[g].push({from:cd,pct:+groups[g]})}
  }
  /* To'lov kunini bir kunga: ikkinchi kurs yoki aka-uka qo'shilsa, avtomatik birinchi kursning to'lov kuniga bog'lanadi */
  let anchor=document.getElementById("sa")?document.getElementById("sa").value:old&&old.anchor||"";
  if(!anchor&&billMode()==="cycle"){
    const added=Object.keys(groups).filter(g=>!(g in prev)),had=Object.keys(prev).filter(g=>g in groups&&S.groups[g]);
    if(old&&added.length&&had.length)anchor=id+"|"+had.sort((a,b)=>courseStart(old,a)<courseStart(old,b)?-1:1)[0];
    else if(!old||!had.length){
      const pk=phKey(document.getElementById("sp").value);
      const sib=pk&&Object.entries(S.students).find(([x,o])=>x!==id&&!o.end&&phKey(o.phone)===pk&&Object.keys(stuCourses(o,month)).some(g=>S.groups[g]));
      if(sib)anchor=sib[1].anchor||sib[0]+"|"+Object.keys(stuCourses(sib[1],month)).filter(g=>S.groups[g]).sort((a,b)=>courseStart(sib[1],a)<courseStart(sib[1],b)?-1:1)[0];
      else if(Object.keys(groups).length>1)anchor=newSid+"|"+Object.keys(groups)[0];
    }
  }
  if(LEAD&&S.leads[LEAD]){put("leads",LEAD,Object.assign({},S.leads[LEAD],{status:"done",sid:newSid}));LEAD=null}
  put("students",newSid,{...(old&&old.tg?{tg:old.tg}:{}),name,phone:document.getElementById("sp").value.trim(),phone2:document.getElementById("sp2").value.trim(),parent:document.getElementById("spn").value.trim(),start:document.getElementById("ss").value,end:document.getElementById("se").value,versions,groupIds:Object.keys(groups),cstart,dh,anchor,family:old?old.family||"":"",disc:old&&old.disc!==undefined?old.disc:""});
  closeSheet();
}

  openSheet(`<h2>Xodim qo'shildi</h2>${note?`<p class="note">${esc(note)}</p>`:""}
  <label class="f">Xodimga shu matnni yuboring<textarea id="mt" rows="5">${esc(txt)}</textarea></label>
  <button class="btn pri wide" onclick="copyMsg()">Matnni nusxalash</button>
  <a class="btn wide" href="https://t.me/share/url?url=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Telegramda yuborish</a>
  <button class="btn wide" onclick="staffSheet()">Xodimlar ro'yxati</button>`);
}

/* ---- Zaxira nusxa ---- */
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="hisob-"+today()+".json";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
let IMP=null;
/* Bir xil yozuvni topish uchun "tabiiy kalit" (ID boshqa bo'lsa ham takror bo'lmasin) */
function natKey(c,v){
  const n=x=>String(x==null?"":x).trim().toLowerCase(),ph=x=>String(x||"").replace(/\D/g,"").slice(-9);
  if(c==="students"||c==="leads")return n(v.name)+"|"+ph(v.phone);
  if(c==="groups"||c==="teachers")return n(v.name);
  if(c==="payments")return [v.sid,v.gid,v.amount,v.date,v.month].join("|");
  if(c==="salaries")return [v.tid,v.amount,v.date,v.month].join("|");
  return "";
}
function importPlan(items){
  const add=[],same=[],dup=[];
  for(const it of items){
    const[c,id,v]=it,cur=S[c]||{};
    if(id in cur){same.push(it);continue}
    const k=natKey(c,v);
    if(k&&Object.values(cur).some(x=>natKey(c,x)===k)){dup.push(it);continue}
    add.push(it);
  }
  return{add,same,dup};
}
async function importPick(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){toast("Faylni o'qib bo'lmadi");return}
  const items=[];
  for(const col of Object.keys(S))if(d&&d[col]&&typeof d[col]==="object")
    for(const[id,v]of Object.entries(d[col]))if(v&&typeof v==="object"&&!Array.isArray(v)&&id&&!id.includes("/"))items.push([col,id,v]);
  if(!items.length){toast("Faylda ma'lumot topilmadi");return}
  /* Saytda shu nomli guruh yoki ustoz bo'lsa, fayldagi o'quvchi va to'lovlar o'shanga ulanadi */
  const map={};
  for(const[c,id,v]of items)if((c==="groups"||c==="teachers")&&!(id in S[c])){
    const hit=Object.entries(S[c]).find(([,x])=>natKey(c,x)===natKey(c,v));if(hit)map[id]=hit[0];
  }
  const re=x=>map[x]||x,reKeys=o=>{if(!o||typeof o!=="object")return o;const r={};for(const k of Object.keys(o))r[re(k)]=o[k];return r};
  if(Object.keys(map).length)for(const it of items){
    const v=it[2]=JSON.parse(JSON.stringify(it[2]));
    if(it[0]==="students"){
      if(Array.isArray(v.groupIds))v.groupIds=v.groupIds.map(re);
      if(Array.isArray(v.versions))v.versions.forEach(x=>x.groups=reKeys(x.groups));
      if(v.absent)v.absent=reKeys(v.absent);
      if(v.anchor){const[a,b]=v.anchor.split("|");v.anchor=a+"|"+re(b)}
    }
    if(it[0]==="payments"||it[0]==="leads")v.gid=re(v.gid);
    if(it[0]==="salaries")v.tid=re(v.tid);
    if(it[0]==="teachers"&&Array.isArray(v.versions))v.versions.forEach(x=>x.courses=reKeys(x.courses));
  }
  const P=importPlan(items);IMP=P.add;
  const by=L=>Object.keys(S).map(c=>[c,L.filter(x=>x[0]===c).length]).filter(x=>x[1]).map(([c,n])=>`<div><span>${esc(c)}</span><span>${n} ta</span></div>`).join("");
  const nm=([c,id,v])=>esc(v.name||[v.date,v.amount&&money(v.amount)].filter(Boolean).join(" · ")||id);
  openSheet(`<h2>Ma'lumotlarni yuklash</h2><p class="note">${esc(f.name)} · ${items.length} ta yozuv</p>
  <div class="ghead"><h2>Qo'shiladi: ${P.add.length}</h2></div>${P.add.length?`<div class="calc">${by(P.add)}</div>`:""}
  ${P.same.length?`<div class="ghead"><h2>Saytda allaqachon bor: ${P.same.length}</h2></div><p class="note">Xuddi shu yozuv (ID) saytda bor — tegilmaydi, ustidan yozilmaydi.</p><div class="calc">${by(P.same)}</div>`:""}
  ${P.dup.length?`<div class="ghead"><h2>O'xshashi bor: ${P.dup.length}</h2></div><p class="note">Saytda shu ism (yoki shu to'lov) boshqa ID bilan bor — takror bo'lmasligi uchun qo'shilmaydi:</p><div class="calc">${P.dup.map(it=>`<div><span>${esc(it[0])}</span><span>${nm(it)}</span></div>`).join("")}</div>`:""}
  <p class="note">Saytdagi hech bir yozuv o'chirilmaydi va o'zgartirilmaydi.</p>
  <div class="acts"><button class="btn" onclick="closeSheet()">Bekor qilish</button><button class="btn pri" id="impgo" onclick="importGo()" ${P.add.length?"":"disabled"}>${P.add.length} ta yozuvni qo'shish</button></div>`);
}
async function importGo(){
  if(!IMP||!IMP.length)return;
  const b=document.getElementById("impgo");b.disabled=true;b.textContent="Yuklanmoqda…";
  /* Oxirgi tekshiruv: shu orada paydo bo'lgan yozuvlarga ham tegilmaydi */
  const L=importPlan(IMP).add;
  try{await AUTH.importDocs(L);IMP=null;closeSheet();toast(L.length+" ta yozuv qo'shildi")}
  catch(e){b.disabled=false;b.textContent="Qayta urinish";toast("Yuklab bo'lmadi. Internetni tekshiring.")}
}
function tcType(gid){
  const t=document.getElementById("ct-"+gid).value,show=(k,on)=>document.getElementById(k+"-"+gid).style.display=on?"flex":"none";
  const unit=document.getElementById("cu-"+gid).value,lim=num(document.getElementById("ck-"+gid).value)||5,per=unit==="month"?"oyiga":"1 soat";
  show("wr",t==="hour"||t==="fixed");show("wh",t==="hour"||(t==="size"&&unit==="hour"));show("wp",t==="pct");show("wb",t==="pct");
  show("wu",t==="size");show("wk",t==="size");show("ws",t==="size");show("wl",t==="size");
  document.getElementById("ls-"+gid).textContent=lim+" nafargacha, "+per+" (so'm)";
  document.getElementById("ll-"+gid).textContent=(lim+1)+"+ nafar, "+per+" (so'm)";
  document.getElementById("lr-"+gid).textContent=t==="hour"?"1 soat narxi (so'm)":"Oylik summa (so'm)";
}
function tchSheet(id){
  const t=id?S.teachers[id]:null,L=Object.entries(S.groups).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const cur=t?tTerms(Object.assign({id},t),month):{};
  openSheet(`<h2>${t?"O'qituvchini tahrirlash":"Yangi o'qituvchi"}</h2>
  <label class="f">Ism va familiya<input id="tn" value="${esc(t?t.name:"")}"></label>
  <label class="f">Telefon<input id="tp" inputmode="tel" value="${esc(t?t.phone||"":"")}"></label>
  <div><div class="lbl" style="margin-bottom:6px">Kurslari va oylik turi</div>${L.length?`<div class="list" id="tg">${L.map(([g,o])=>{const on=g in cur,c=cur[g]||{type:"hour"},v=version(o,month);return `<div class="course"><label class="check"><input type="checkbox" value="${g}" ${on?"checked":""} onchange="togC(this)"><span>${esc(o.name)}<br><span class="lbl">${esc(dayNames(v.days))}${o.time?" · "+esc(o.time):""}</span></span></label><div class="sub" style="display:${on?"flex":"none"}">
    <label>Oylik turi<select id="ct-${g}" onchange="tcType('${g}')"><option value="hour" ${c.type==="hour"?"selected":""}>Soatbay</option><option value="size" ${c.type==="size"?"selected":""}>O'quvchi soniga qarab</option><option value="pct" ${c.type==="pct"?"selected":""}>Foiz</option><option value="fixed" ${c.type==="fixed"?"selected":""}>Oylik</option></select></label>
    <label id="wu-${g}">Narx nima uchun<select id="cu-${g}" onchange="tcType('${g}')"><option value="hour" ${c.unit!=="month"?"selected":""}>1 soat uchun</option><option value="month" ${c.unit==="month"?"selected":""}>Oyiga</option></select></label>
    <label id="wk-${g}">Necha nafargacha kichik guruh<input id="ck-${g}" inputmode="numeric" value="${c.limit||5}" oninput="tcType('${g}')"></label>
    <label id="ws-${g}"><span id="ls-${g}"></span><input id="cs-${g}" inputmode="numeric" value="${c.small?money(c.small):""}" oninput="fmtMoney(this)"></label>
    <label id="wl-${g}"><span id="ll-${g}"></span><input id="cl-${g}" inputmode="numeric" value="${c.large?money(c.large):""}" oninput="fmtMoney(this)"></label>
    <label id="wr-${g}"><span id="lr-${g}"></span><input id="cr-${g}" inputmode="numeric" value="${c.rate?money(c.rate):""}" oninput="fmtMoney(this)"></label>
    <div class="dh" id="wh-${g}">Shu ustoz har kuni necha soat o'tadi<div>${DAYS.filter(([d])=>v.days.includes(d)).map(([d,l])=>`<div class="dd"><span>${l}</span><div class="stp"><button type="button" aria-label="${l}: yarim soat kamaytirish" onclick="stepH('ch-${g}-${d}',-0.5)">−</button><input id="ch-${g}-${d}" aria-label="${l}: soat" inputmode="decimal" value="${c.dayHours&&c.dayHours[d]!==undefined?c.dayHours[d]:(on?(c.hours||v.hours||1.5):0.5)}"><button type="button" aria-label="${l}: yarim soat qo'shish" onclick="stepH('ch-${g}-${d}',0.5)">+</button></div></div>`).join("")}</div></div>
    <label id="wp-${g}">Foiz (%)<input id="cp-${g}" inputmode="decimal" value="${c.pct||""}"></label>
    <label id="wb-${g}">Nimadan<select id="cb-${g}"><option value="paid" ${c.base!=="billed"?"selected":""}>Tushgan puldan</option><option value="billed" ${c.base==="billed"?"selected":""}>Hisoblangan summadan</option></select></label>
  </div></div>`}).join("")}</div>`:`<p class="note">Avval guruh qo'shing.</p>`}</div>
  ${t?`<p class="note">O'zgarishlar ${mName(month)} oyidan boshlab qo'llanadi.</p>`:""}
  <div class="acts"><button class="btn" onclick="closeSheet()">Bekor qilish</button><button class="btn pri" onclick="saveTch(${t?`'${id}'`:""})">Saqlash</button></div>
  ${t?`<button class="btn del wide" onclick="armDelete(this,()=>{closeSheet();del('teachers','${id}')})">O'qituvchini o'chirish</button>`:""}`);
  L.forEach(([g])=>tcType(g));
}
function stepH(id,n){const el=document.getElementById(id),x=Math.round((parseFloat(el.value.replace(",","."))||0)*2)/2;el.value=Math.max(0,x+n)}
function readHours(g){
  const o={};let sum=0;
  for(const d of version(S.groups[g],month).days){
    const raw=document.getElementById("ch-"+g+"-"+d).value.trim().replace(",","."),e=raw===""?0:Math.round(parseFloat(raw)*2)/2;
    if(!(e>=0))return null;
    o[d]=e;sum+=e;
  }
  return sum>0?o:null;
}
function saveTch(id){
  const name=document.getElementById("tn").value.trim();
  if(!name){toast("Ism va familiyani kiriting");return}
  const courses={};
  for(const i of document.querySelectorAll("#tg input[type=checkbox]:checked")){
    const g=i.value,type=document.getElementById("ct-"+g).value,gn=S.groups[g].name;
    if(type==="pct"){
      const pct=parseFloat(document.getElementById("cp-"+g).value.replace(",","."));
      if(!(pct>0&&pct<=100)){toast(gn+": foizni 1 dan 100 gacha kiriting");return}
      courses[g]={type,pct,base:document.getElementById("cb-"+g).value};
    }else if(type==="size"){
      const limit=num(document.getElementById("ck-"+g).value),small=num(document.getElementById("cs-"+g).value),large=num(document.getElementById("cl-"+g).value),unit=document.getElementById("cu-"+g).value;
      if(!limit||!small||!large){toast(gn+": o'quvchi soni va ikkala narxni kiriting");return}
      courses[g]={type,limit,small,large,unit};
      if(unit==="hour"){
        const dayHours=readHours(g);
        if(!dayHours){toast(gn+": kunlar bo'yicha soatni kiriting");return}
        courses[g].dayHours=dayHours;
      }
    }else{
      const rate=num(document.getElementById("cr-"+g).value);
      if(!rate){toast(gn+": summani kiriting");return}
      courses[g]={type,rate};
      if(type==="hour"){
        const dayHours=readHours(g);
        if(!dayHours){toast(gn+": kunlar bo'yicha soatni kiriting");return}
        courses[g].dayHours=dayHours;
      }
    }
  }
  const old=id?S.teachers[id]:null;
  let versions;
  if(!old)versions=[{from:"2000-01",courses}];
  else{
    const hist=old.versions.some(v=>v.courses)?old.versions:[{from:"2000-01",courses:tTerms(Object.assign({id},old),month)}];
    versions=[...hist.filter(x=>x.from!==month),{from:month,courses}];
  }
  put("teachers",id||uid(),{name,phone:document.getElementById("tp").value.trim(),versions});
  closeSheet();
}
function salSheet(id){
  C={};
  const t=S.teachers[id],p=teacherPay(id,t,month),L=salaryPaid(id,month),given=L.reduce((a,x)=>a+x.amount,0),left=Math.max(0,p.total-given);
  openSheet(`<h2>${esc(t.name)}</h2><p class="note">${mName(month)} oyligi</p>
  <div class="calc"><div><span>Hisoblangan</span><span>${money(p.total)}</span></div><div><span>Berilgan</span><span>${money(given)}</span></div><div class="t"><span>Qoldi</span><span>${money(left)} so'm</span></div></div>
  ${L.length?`<div class="list">${L.sort((x,y)=>x.date<y.date?-1:1).map(x=>`<div class="row"><div><div class="val">${money(x.amount)} so'm</div><div class="lbl">${esc(x.date)} · ${esc(x.method)}</div></div><button class="btn del" onclick="armDelete(this,()=>{del('salaries','${x.id}');salSheet('${id}')})">O'chirish</button></div>`).join("")}</div>`:""}
  <label class="f">Summa<input id="sa" inputmode="numeric" value="${left?money(left):""}" oninput="fmtMoney(this)"></label>
  <div class="two"><label class="f">Sana<input id="sdt" type="date" value="${today()}"></label><label class="f">Usul<select id="sm"><option>Naqd</option><option>Karta</option><option>O'tkazma</option></select></label></div>
  <div class="acts"><button class="btn" onclick="closeSheet()">Yopish</button><button class="btn pri" onclick="saveSal('${id}')">Oylikni yozish</button></div>`);
}
function saveSal(tid){
  const amount=num(document.getElementById("sa").value);
  if(!amount){toast("Summani kiriting");return}
  put("salaries",uid(),{month,tid,amount,date:document.getElementById("sdt").value||today(),method:document.getElementById("sm").value});
  closeSheet();toast("Oylik yozildi");
}
render();
</script>
<script type="module">
/* ---- Firebase: kirish va ma'lumotlar bazasi ---- */
const SDK="https://www.gstatic.com/firebasejs/10.12.2/";
const box=document.getElementById("login"),err=document.getElementById("auErr"),btn=document.getElementById("auBtn");
function flash(){try{const m=sessionStorage.getItem("authMsg");sessionStorage.removeItem("authMsg");return m||""}catch(e){return""}}
function showLogin(msg,locked){
  document.body.classList.add("out");closeSheet();box.hidden=false;
  err.textContent=msg||flash();btn.disabled=!!locked;btn.textContent="Kirish";
  document.getElementById("app").innerHTML="";
}
async function main(){
  let cfg=null;
  try{cfg=(await import("./config.js?v=2")).firebaseConfig}catch(e){}
  if(!cfg||!cfg.apiKey){showLogin("Sayt hali ulanmagan: Firebase sozlamalari qo'shilgach ishlaydi.",true);return}
  let A,Au,Fs;
  try{[A,Au,Fs]=await Promise.all([import(SDK+"firebase-app.js"),import(SDK+"firebase-auth.js"),import(SDK+"firebase-firestore.js")])}
  catch(e){showLogin("Internetga ulanib bo'lmadi. Aloqani tekshirib, sahifani yangilang.");return}
  const app=A.initializeApp(cfg),auth=Au.getAuth(app),fs=Fs.initializeFirestore(app,{ignoreUndefinedProperties:true});
  const api={collection:c=>({
    doc:id=>({set:d=>Fs.setDoc(Fs.doc(fs,c,id),d),delete:()=>Fs.deleteDoc(Fs.doc(fs,c,id))}),
    onSnapshot:(cb,er)=>Fs.onSnapshot(Fs.collection(fs,c),cb,er)
  })};
  let staff={},started=false,denied=false;
  /* Xodim faqat shu bo'limlarni o'qiydi: ustozlar va oyliklar rahbarniki */
  const WORKER=["groups","students","payments","settings","leads"];
  window.AUTH={
    email:"",uid:"",role:"",
    get owner(){return this.role==="owner"},
    staff:()=>Object.entries(staff).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.name||a.email||a.id).localeCompare(b.name||b.email||b.id)),
    staffName:id=>staff[id]?staff[id].name||staff[id].email||"":"",
    async logout(){try{await Au.signOut(auth)}catch(e){}location.reload()},
    async denied(){
      if(denied)return;denied=true;
      try{sessionStorage.setItem("authMsg",`«${this.email}» uchun ruxsat yo'q. Rahbardan sizni xodimlar ro'yxatiga qo'shishini so'rang. (UID: ${this.uid})`)}catch(e){}
      try{await Au.signOut(auth)}catch(e){}location.reload();
    },
    /* Xodim akkaunti alohida (ikkinchi) ilovada ochiladi, rahbar chiqib ketmaydi */
    async addStaff(email,pass,name){
      let id="";
      const sec=A.initializeApp(cfg,"add-"+Date.now()),sa=Au.initializeAuth(sec,{persistence:Au.inMemoryPersistence});
      try{const cr=await Au.createUserWithEmailAndPassword(sa,email,pass);id=cr.user.uid}
      catch(x){
        const c=x&&x.code||"";
        if(c==="auth/email-already-in-use")throw new Error("Bu email bilan akkaunt allaqachon bor. Boshqa email yozing yoki Firebase konsolida (Authentication → Users) eski akkauntni o'chirib, qayta qo'shing.");
        if(c==="auth/weak-password")throw new Error("Parol juda oddiy. Kamida 6 belgi yozing.");
        if(c==="auth/invalid-email")throw new Error("Email noto'g'ri yozilgan.");
        if(c==="auth/operation-not-allowed")throw new Error("Firebase'da Email/Password kirish yoqilmagan.");
        if(c==="auth/network-request-failed")throw new Error("Internetga ulanib bo'lmadi.");
        throw new Error("Akkaunt ochib bo'lmadi ("+c+").");
      }finally{
        try{await Au.signOut(sa)}catch(e){}
        try{await A.deleteApp(sec)}catch(e){}
      }
      await Fs.setDoc(Fs.doc(fs,"staff",id),{email,name:name||"",added:new Date().toISOString().slice(0,10)});
      return id;
    },
    removeStaff:id=>Fs.deleteDoc(Fs.doc(fs,"staff",id)),
    async importDocs(items){
      for(let i=0;i<items.length;i+=400){
        const b=Fs.writeBatch(fs);
        items.slice(i,i+400).forEach(([c,id,v])=>b.set(Fs.doc(fs,c,id),v));
        await b.commit();
      }
    }
  };
  window.doLogin=async e=>{
    if(e)e.preventDefault();
    const em=document.getElementById("auE").value.trim(),pw=document.getElementById("auP").value;
    if(!em||!pw){err.textContent="Email va parolni yozing.";return false}
    err.textContent="";btn.disabled=true;btn.textContent="Kirilmoqda…";
    try{await Au.signInWithEmailAndPassword(auth,em,pw)}
    catch(x){
      const c=x&&x.code||"";
      const bad=["auth/invalid-credential","auth/invalid-login-credentials","auth/wrong-password","auth/user-not-found","auth/user-disabled"].includes(c);
      showLogin(bad?"Email yoki parol noto'g'ri.":c==="auth/too-many-requests"?"Juda ko'p urinish bo'ldi. Birozdan keyin qayta urinib ko'ring.":c==="auth/network-request-failed"?"Internetga ulanib bo'lmadi.":c==="auth/invalid-email"?"Email noto'g'ri yozilgan.":"Kirib bo'lmadi ("+(c||"xato")+"). Rahbarga ayting.");
    }
    return false;
  };
  Au.onAuthStateChanged(auth,u=>{
    if(!u){if(!started)showLogin();return}
    if(started)return;started=true;
    AUTH.email=(u.email||"").toLowerCase();AUTH.uid=u.uid;
    box.hidden=true;err.textContent="";document.body.classList.remove("out");
    document.getElementById("app").innerHTML=`<p class="note">Yuklanmoqda…</p>`;
    let decided=false;
    const start=(role,cols)=>{if(decided)return;decided=true;AUTH.role=role;render();init(api,cols)};
    /* Rolni Firestore qoidalari belgilaydi: xodimlar ro'yxatini faqat rahbar (UID) o'qiy oladi,
       xodim esa faqat o'z yozuvini (staff/<UID>) ko'radi. Boshqa hamma — ruxsatsiz. */
    Fs.onSnapshot(Fs.collection(fs,"staff"),s=>{
      staff={};s.docs.forEach(d=>staff[d.id]=d.data());start("owner");
    },()=>{
      if(decided)return;
      Fs.onSnapshot(Fs.doc(fs,"staff",u.uid),d=>{
        if(!d.exists()){AUTH.denied();return}
        start("worker",WORKER);
      },()=>AUTH.denied());
    });
  });
}
main();
</script>
