<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership Learning House kurslariga yozilish</title>
<meta name="description" content="Leadership Learning House (Chilonzor, Toshkent): kurs va qulay vaqtni tanlang, ariza Telegram orqali yuboriladi.">
<meta property="og:title" content="Leadership Learning House kurslariga yozilish">
<meta property="og:description" content="Kurs va qulay vaqtni tanlang — ariza Telegram orqali bizga keladi.">
<meta name="theme-color" content="#083D41">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, brand band on top, numbered steps (course -> details -> send) */
:root{
  --teal:#0E5E63;
  --teal-deep:#083D41;
  --sun:#F6C343;
  --sun-soft:#FFF5D6;
  --paper:#F3F7F6;
  --card:#FFFFFF;
  --ink:#122A2C;
  --muted:#587073;
  --line:#D3E2E0;
  --danger:#B3261E;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Brand band */
.band{background:var(--teal-deep);color:#fff;padding:22px 0 26px;border-bottom:6px solid var(--sun)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:var(--sun);display:grid;place-items:center;flex:none}
.mark svg{width:28px;height:28px;fill:var(--teal-deep)}
.brand-name{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;line-height:1.3}
.brand-name small{display:block;font-family:var(--body);font-weight:600;letter-spacing:0;font-size:13px;color:#BFD8D6;margin-top:2px}
.band h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;margin:20px 0 8px;text-wrap:balance}
.band p{margin:0;color:#D6E8E6;max-width:44ch}

/* Steps */
main{padding:20px 0 8px;display:grid;gap:22px}
.step{display:grid;gap:12px}
.step-head{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.step-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:18px}
.hint{margin:-4px 0 0 38px;color:var(--muted);font-size:14px}

/* Course cards */
.courses{display:grid;gap:10px}
.course{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s}
.course.on{border-color:var(--teal);box-shadow:0 0 0 1.5px var(--teal) inset}
.course-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:none;border:0;text-align:left;cursor:pointer}
.ico{width:44px;height:44px;border-radius:12px;background:var(--sun-soft);display:grid;place-items:center;font-size:24px;flex:none}
.course-text{flex:1;min-width:0}
.course-name{display:block;font-weight:800;font-size:16px;line-height:1.3}
.course-desc{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px}
.course-price{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--teal);background:#E3F0EF;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.course.on .tick{background:var(--sun);border-color:var(--sun)}
.tick svg{width:14px;height:14px;fill:none;stroke:var(--teal-deep);stroke-width:3;opacity:0}
.course.on .tick svg{opacity:1}
.slots{padding:0 14px 14px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px;margin:0 14px 0;padding-left:0;padding-right:0}
.slots-label{font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
.chip[aria-checked="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.no-slots{font-size:14px;color:var(--muted);background:var(--paper);border-radius:12px;padding:10px 12px}

/* Fields */
.fields{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 120px;gap:12px}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px}
.field label span{font-weight:500;color:var(--muted)}
.input,.select,.textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;min-height:48px}
.textarea{min-height:76px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(246,195,67,.55)}
.phone{display:flex;align-items:stretch}
.phone .pre{display:grid;place-items:center;padding:0 12px;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.phone .input{border-radius:0 12px 12px 0;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.bad{border-color:var(--danger)!important}

/* Send */
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:16px;background:var(--teal);color:#fff;text-decoration:none;font-weight:800;font-size:17px;border:0;cursor:pointer;box-shadow:0 6px 0 var(--teal-deep)}
.send:active{transform:translateY(3px);box-shadow:0 3px 0 var(--teal-deep)}
.send svg{width:22px;height:22px;fill:#fff}
.send-note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}
.done{background:var(--sun-soft);border:1.5px solid var(--sun);border-radius:16px;padding:16px;display:grid;gap:10px}
.done h3{margin:0;font-family:var(--display);font-weight:500;font-size:17px}
.done p{margin:0;font-size:14px}
.preview{white-space:pre-wrap;background:#fff;border-radius:12px;padding:12px;font-size:14px;line-height:1.45;border:1px solid #F0DFA8;margin:0;font-family:var(--body)}
.btn{border:1.5px solid var(--teal);background:#fff;color:var(--teal);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Footer */
footer.wrap{padding:26px 16px 40px;color:var(--muted);font-size:14px;display:grid;gap:4px}
footer b{color:var(--ink)}

@media (max-width:400px){
  .band h1{font-size:24px}
  .row2{grid-template-columns:1fr 104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.send:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";
var STATE = JSON.parse(document.getElementById("state").textContent);
var sel = {};            // courseId -> slot index (number) | null (slot not chosen yet) | -1 (course has no slots)
var form = {child:"", age:"", parent:"", phone:"", note:""};
var errors = {};
var shownDone = false;

var ICON_CROWN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18.5h18l-1.6-10-4.6 4.2L12 5l-2.8 7.7-4.6-4.2L3 18.5Z"/><circle cx="12" cy="4" r="1.6"/><circle cx="3.2" cy="7.6" r="1.4"/><circle cx="20.8" cy="7.6" r="1.4"/><rect x="3" y="19.6" width="18" height="2" rx="1"/></svg>';
var ICON_TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
var ICON_TG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 3.6 2.9 10.8c-1.1.4-1 1.9.1 2.2l4.6 1.4 1.8 5.5c.3.8 1.3 1 1.9.4l2.6-2.4 4.8 3.5c.7.5 1.7.1 1.8-.7l3-15.6c.2-1-.8-1.8-1.7-1.5Zm-3.6 4.1-8.4 7.6-.4 3-1.2-3.9 9.6-6.9c.3-.2.6.1.4.2Z"/></svg>';

function h(tag, props){
  var el = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid){
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ append(el, k); }); return; }
  el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function tgUser(){ return String(STATE.telegram || "").replace(/^@/, "").trim(); }
function digits(s){ return String(s || "").replace(/\D/g, ""); }
function fmtPhone(d){
  d = digits(d).slice(0, 9);
  var parts = [d.slice(0,2), d.slice(2,5), d.slice(5,7), d.slice(7,9)].filter(Boolean);
  return parts.join(" ");
}
function courseById(id){ for (var i=0;i<STATE.courses.length;i++) if (STATE.courses[i].id === id) return STATE.courses[i]; return null; }
function chosenIds(){ return STATE.courses.map(function(c){return c.id;}).filter(function(id){ return Object.prototype.hasOwnProperty.call(sel, id); }); }

/* ---------- message ---------- */
function buildMessage(){
  var lines = ["Assalomu alaykum! Farzandimni kursga yozmoqchiman.", ""];
  lines.push("👶 Farzand: " + (form.child.trim() || "—") + (form.age ? ", " + form.age + " yosh" : ""));
  lines.push("📚 Kurs:");
  chosenIds().forEach(function(id){
    var c = courseById(id), s = sel[id];
    var t = (typeof s === "number" && s >= 0 && c.slots[s]) ? " — " + c.slots[s] : (c.slots.length ? "" : " — vaqtni kelishamiz");
    lines.push("• " + c.name + t);
  });
  lines.push("");
  lines.push("👤 Ota-ona: " + (form.parent.trim() || "—"));
  lines.push("📞 Telefon: +998 " + fmtPhone(form.phone));
  if (form.note.trim()) lines.push("💬 Izoh: " + form.note.trim());
  return lines.join("\n");
}
function tgLink(){ return "https://t.me/" + encodeURIComponent(tgUser()) + "?text=" + encodeURIComponent(buildMessage()); }

function validate(){
  var e = {};
  var ids = chosenIds();
  if (!ids.length) e.courses = "Kamida bitta kursni tanlang.";
  else {
    var missing = ids.filter(function(id){ return sel[id] === null; }).map(function(id){ return courseById(id).name; });
    if (missing.length) e.courses = "Vaqtni tanlang: " + missing.join(", ") + ".";
  }
  if (!form.child.trim()) e.child = "Farzandingiz ismini yozing.";
  if (!form.age) e.age = "Yoshini tanlang.";
  if (!form.parent.trim()) e.parent = "Ismingizni yozing.";
  if (digits(form.phone).length !== 9) e.phone = "Raqamni to‘liq yozing: 9 ta raqam, masalan 90 123 45 67.";
  return e;
}

/* ---------- render ---------- */
var app = document.getElementById("app");
var refs = {};

function render(){
  app.innerHTML = "";
  var band = h("header", {class:"band"},
    h("div", {class:"wrap"},
      h("div", {class:"brand"},
        h("div", {class:"mark", html: ICON_CROWN}),
        h("div", {class:"brand-name"}, "LEADERSHIP LEARNING HOUSE", h("small", {text: STATE.address || ""}))
      ),
      h("h1", {text:"Kursga yozilish"}),
      h("p", {text:"Kurs va qulay vaqtni tanlang. Ariza Telegram orqali to‘g‘ridan-to‘g‘ri bizga keladi, biz siz bilan bog‘lanamiz."})
    )
  );

  refs.courses = h("div", {class:"courses", role:"group", "aria-label":"Kurslar"});
  refs.coursesErr = h("div", {class:"err", id:"err-courses", "aria-live":"polite"});
  var step1 = h("section", {class:"step", id:"step-courses"},
    h("div", {class:"step-head"}, h("span", {class:"num", text:"1"}), h("h2", {text:"Kursni tanlang"})),
    h("p", {class:"hint", text:"Bir nechta kursni tanlash mumkin."}),
    refs.courses, refs.coursesErr
  );

  var step2 = h("section", {class:"step"},
    h("div", {class:"step-head"}, h("span", {class:"num", text:"2"}), h("h2", {text:"Ma’lumotlaringiz"})),
    h("div", {class:"fields"},
      h("div", {class:"row2"},
        field("child", "Farzandingiz ismi", h("input", {class:"input", id:"f-child", type:"text", autocomplete:"off", placeholder:"Masalan, Aziza", value:form.child, oninput:function(e){ form.child = e.target.value; touch("child"); }})),
        field("age", "Yoshi", ageSelect())
      ),
      field("parent", "Sizning ismingiz", h("input", {class:"input", id:"f-parent", type:"text", autocomplete:"name", placeholder:"Ota yoki ona ismi", value:form.parent, oninput:function(e){ form.parent = e.target.value; touch("parent"); }})),
      field("phone", "Telefon raqamingiz", h("div", {class:"phone"},
        h("span", {class:"pre", text:"+998"}),
        h("input", {class:"input", id:"f-phone", type:"tel", inputmode:"numeric", autocomplete:"tel-national", placeholder:"90 123 45 67", value:fmtPhone(form.phone), oninput:function(e){
          form.phone = digits(e.target.value).slice(0, 9);
          var f = fmtPhone(form.phone);
          if (e.target.value !== f) e.target.value = f;
          touch("phone");
        }})
      )),
      field("note", ["Izoh ", h("span", {text:"(ixtiyoriy)"})], h("textarea", {class:"textarea", id:"f-note", placeholder:"Savolingiz yoki qulay kunlar", oninput:function(e){ form.note = e.target.value; updateLink(); }}, form.note))
    )
  );

  refs.send = h("a", {class:"send", id:"send", href:tgLink(), target:"_blank", rel:"noopener noreferrer", onclick:onSend, html: ICON_TG + "<span>Telegram orqali yuborish</span>"});
  refs.done = h("div", {id:"done"});
  var step3 = h("section", {class:"step"},
    h("div", {class:"step-head"}, h("span", {class:"num", text:"3"}), h("h2", {text:"Arizani yuboring"})),
    refs.send,
    h("p", {class:"send-note", text:"Telegram ochiladi, ariza matni tayyor bo‘ladi. U yerda «Yuborish» tugmasini bossangiz bo‘ldi."}),
    refs.done
  );

  var foot = h("footer", {class:"wrap"},
    h("div", null, h("b", {text:"Leadership Learning House"})),
    STATE.address ? h("div", {text: STATE.address}) : null,
    h("div", {text: "Telegram: @" + tgUser()}),
    STATE.phone ? h("div", {text: "Telefon: " + STATE.phone}) : null
  );

  app.appendChild(band);
  app.appendChild(h("main", {class:"wrap"}, step1, step2, step3));
  app.appendChild(foot);
  renderCourses();
  renderDone();
}

function field(key, label, control){
  var err = h("div", {class:"err", id:"err-" + key});
  refs["err_" + key] = err;
  refs["ctl_" + key] = control;
  var forId = control.tagName === "DIV" ? "f-phone" : control.id;
  return h("div", {class:"field"}, h("label", {"for": forId}, label), control, err);
}
function ageSelect(){
  var s = h("select", {class:"select", id:"f-age", onchange:function(e){ form.age = e.target.value; touch("age"); }});
  s.appendChild(h("option", {value:""}, "—"));
  for (var a = 3; a <= 14; a++) {
    var o = h("option", {value:String(a)}, a + " yosh");
    if (String(a) === form.age) o.selected = true;
    s.appendChild(o);
  }
  return s;
}

function renderCourses(){
  var box = refs.courses;
  box.innerHTML = "";
  STATE.courses.forEach(function(c){
    var on = Object.prototype.hasOwnProperty.call(sel, c.id);
    var head = h("button", {type:"button", class:"course-head", "aria-pressed": on ? "true" : "false", onclick:function(){
      if (on) delete sel[c.id]; else sel[c.id] = c.slots.length ? (c.slots.length === 1 ? 0 : null) : -1;
      renderCourses(); touch("courses");
    }},
      h("span", {class:"ico", "aria-hidden":"true", text: c.emoji || "📘"}),
      h("span", {class:"course-text"},
        h("span", {class:"course-name", text:c.name}),
        c.desc ? h("span", {class:"course-desc", style:"display:block", text:c.desc}) : null,
        c.price ? h("span", {class:"course-price", text:c.price}) : null
      ),
      h("span", {class:"tick", html: ICON_TICK})
    );
    var card = h("div", {class: "course" + (on ? " on" : "")}, head);
    if (on) {
      var slotsBox = h("div", {class:"slots"});
      if (c.slots.length) {
        slotsBox.appendChild(h("div", {class:"slots-label", id:"lbl-" + c.id, text:"Qaysi vaqt qulay?"}));
        var chips = h("div", {class:"chips", role:"radiogroup", "aria-labelledby":"lbl-" + c.id});
        c.slots.forEach(function(s, i){
          chips.appendChild(h("button", {type:"button", class:"chip", role:"radio", "aria-checked": sel[c.id] === i ? "true" : "false", onclick:function(){ sel[c.id] = i; renderCourses(); touch("courses"); }}, s));
        });
        slotsBox.appendChild(chips);
      } else {
        slotsBox.appendChild(h("div", {class:"no-slots", text:"Dars vaqtini siz bilan telefon orqali kelishamiz."}));
      }
      card.appendChild(slotsBox);
    }
    box.appendChild(card);
  });
}

function touch(key){
  if (errors[key]) { var e = validate(); errors[key] = e[key]; paintErrors(); }
  updateLink();
}
function paintErrors(){
  ["courses","child","age","parent","phone"].forEach(function(k){
    var el = k === "courses" ? refs.coursesErr : refs["err_" + k];
    if (el) el.textContent = errors[k] || "";
    var ctl = refs["ctl_" + k];
    if (ctl) {
      var target = ctl.tagName === "DIV" ? ctl.querySelector("input") : ctl;
      if (errors[k]) { target.classList.add("bad"); target.setAttribute("aria-invalid","true"); target.setAttribute("aria-describedby","err-" + k); }
      else { target.classList.remove("bad"); target.removeAttribute("aria-invalid"); }
    }
  });
}
function updateLink(){ if (refs.send) refs.send.href = tgLink(); if (shownDone) renderDone(); }

function onSend(ev){
  errors = validate();
  paintErrors();
  var keys = Object.keys(errors);
  if (keys.length) {
    ev.preventDefault();
    var first = keys[0] === "courses" ? document.getElementById("step-courses") : document.getElementById(keys[0] === "phone" ? "f-phone" : "f-" + keys[0]);
    if (first) { first.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); if (first.focus && first.tagName !== "SECTION") first.focus({preventScroll:true}); }
    return;
  }
  refs.send.href = tgLink();
  try { if (navigator.clipboard) navigator.clipboard.writeText(buildMessage()).catch(function(){}); } catch(e) {}
  shownDone = true;
  renderDone();
}

function renderDone(){
  var box = refs.done;
  if (!box) return;
  box.innerHTML = "";
  if (!shownDone) return;
  var copyBtn = h("button", {type:"button", class:"btn", onclick:function(){
    var ok = function(){ copyBtn.textContent = "Nusxa olindi ✓"; };
    try { navigator.clipboard.writeText(buildMessage()).then(ok, function(){ copyBtn.textContent = "Matnni qo‘lda belgilab oling"; }); }
    catch(e){ copyBtn.textContent = "Matnni qo‘lda belgilab oling"; }
  }}, "Matnni nusxa olish");
  box.appendChild(h("div", {class:"done", role:"status"},
    h("h3", {text:"Telegram’da «Yuborish»ni bosing"}),
    h("p", {text:"Ariza Telegram’da @" + tgUser() + " chatida ochiladi. Xabar yuborilgach, biz siz bilan bog‘lanamiz."}),
    h("pre", {class:"preview", text: buildMessage()}),
    h("div", {class:"btns"}, copyBtn),
    h("p", {text:"Matn chatda chiqmasa, «Matnni nusxa olish»ni bosib, chatga joylang."})
  ));
}

render();
})();
</script>
</body>
</html>
