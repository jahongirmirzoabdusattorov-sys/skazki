<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#FFF8E8;color:#16383F;min-height:100vh;overflow-x:hidden}
body:before{content:'';position:fixed;right:-90px;top:-90px;width:240px;height:240px;background:#33B4C0;transform:rotate(45deg);border-radius:36px;opacity:.13;z-index:-1}
body:after{content:'';position:fixed;left:-100px;bottom:-100px;width:260px;height:260px;background:#FDD610;transform:rotate(30deg);border-radius:44px;opacity:.2;z-index:-1}
#app{max-width:620px;margin:0 auto;padding:12px 14px 140px}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-user-select:none;user-select:none}
h1,h2,h3,p{margin:0}
.btn{border:0;border-radius:20px;background:#33B4C0;color:#fff;font-weight:900;font-size:19px;padding:14px 22px;box-shadow:0 5px 0 #1F8A97;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1F8A97}
.btn.y{background:#FDD610;color:#16383F;box-shadow:0 5px 0 #D2A600}
.btn.y:active{box-shadow:0 1px 0 #D2A600}
.btn.w{background:#fff;color:#1F8A97;box-shadow:0 5px 0 #CFE3E6}
.btn.w:active{box-shadow:0 1px 0 #CFE3E6}
.btn.r{background:#F0544F;box-shadow:0 5px 0 #C23A36}
.btn.big{font-size:26px;padding:18px 44px;border-radius:26px}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 #D6E6E8;font-size:20px;flex:none;display:grid;place-items:center;padding:0;font-weight:900;color:#1F8A97}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #D6E6E8}
.bar,.lbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btitle,.ltitle{flex:1;text-align:center;font-weight:900;font-size:20px;color:#1F8A97}
.ltitle{font-size:18px}
.prog{flex:1;height:16px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 0 #E4EEF0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#33B4C0,#2EB872);border-radius:10px;transition:width .4s}
/* home */
.home{text-align:center;padding-top:6px}
.home .logo{width:118px;height:auto}
.home h1{font-size:44px;line-height:1;font-weight:900;color:#33B4C0;letter-spacing:.5px;margin-top:6px}
.home h1 span{color:#1F8A97}
.home .sub{font-size:15px;font-weight:700;color:#4B6B71;margin:10px auto 0;max-width:420px}
.abc{display:flex;gap:7px;justify-content:center;margin-top:14px}
.abc span{width:40px;height:40px;border-radius:11px;background:#33B4C0;color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 0 #1F8A97}
.abc span:nth-child(even){background:#FDD610;color:#16383F;box-shadow:0 3px 0 #D2A600}
.hbear{width:190px;height:auto;margin:16px auto 0;display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.bub2{background:#fff;border-radius:20px;padding:12px 16px;font-weight:800;font-size:17px;max-width:360px;margin:6px auto 22px;box-shadow:0 4px 0 #EFE3C2;position:relative}
.bub2:before{content:'';position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.foot{margin-top:26px;font-size:13px;font-weight:700;color:#7B9297}
/* map */
.mapinfo{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 #EFE3C2;margin-bottom:16px}
.mapinfo img{width:56px}
.mapinfo b{display:block;font-size:20px}
.mapinfo span{font-weight:800;color:#1F8A97}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{position:relative;border:0;background:#fff;border-radius:22px;padding:14px 12px 12px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.07);border-bottom:5px solid var(--c);display:flex;flex-direction:column;gap:6px;min-height:118px}
.mt:active{transform:translateY(3px)}
.mn{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;font-weight:900;font-size:21px;display:grid;place-items:center}
.mtt{font-weight:900;font-size:16px;line-height:1.15}
.md{display:flex;gap:5px;margin-top:auto}
.md i{width:14px;height:14px;border-radius:50%;background:#E6EEF0}
.md i.on{background:var(--c)}
.mstar{position:absolute;top:8px;right:10px;font-size:26px;animation:pop .5s}
/* month */
.mhead{background:var(--c);color:#fff;border-radius:24px;padding:16px 16px 16px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;min-height:120px}
.mhead h2{font-size:24px;font-weight:900;line-height:1.1}
.mhead p{font-size:14px;font-weight:700;opacity:.92;margin-top:4px}
.mnum{width:52px;height:52px;flex:none;border-radius:16px;background:rgba(255,255,255,.25);font-size:28px;font-weight:900;display:grid;place-items:center;align-self:flex-start}
.mbear{position:absolute;right:-8px;bottom:-26px;width:104px}
.mhead>div{position:relative;z-index:1;padding-right:70px}
.lessons{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.lcard{border:0;background:#fff;border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.lcard:active{transform:translateY(3px)}
.ln{width:44px;height:44px;flex:none;border-radius:14px;color:#fff;font-weight:900;font-size:21px;display:grid;place-items:center}
.lt{flex:1}
.lt b{display:block;font-size:17px;line-height:1.2}
.lt small{font-weight:700;color:#6B8287;font-size:13px}
.ls{font-size:18px;letter-spacing:-1px;color:#FDB900;white-space:nowrap}
.ls .off{color:#DDE6E8}
.ls.big{font-size:30px}
.lcard.test{background:#FFF6C9;box-shadow:0 4px 0 #EFD98A}
.lcard.test .ln{background:#FDD610}
.mnav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.mnav .btn{font-size:15px;padding:11px 14px}
/* lesson */
.introbox{display:flex;gap:6px;align-items:flex-end;margin:4px 0 6px}
.ibear{width:96px;flex:none}
.bigbub{background:#fff;border-radius:22px;padding:14px 16px;font-weight:800;font-size:18px;line-height:1.35;box-shadow:0 4px 0 #EFE3C2;position:relative;flex:1}
.bigbub:after{content:'';position:absolute;left:-12px;bottom:22px;border:12px solid transparent;border-left:0;border-right-color:#fff}
.say{border:0;background:#E3F5F7;color:#1F8A97;width:44px;height:44px;border-radius:14px;font-size:21px;flex:none;display:grid;place-items:center;padding:0}
.say.sm{width:36px;height:36px;font-size:17px;border-radius:12px;display:inline-grid;vertical-align:middle;margin-left:4px}
.say:active{transform:scale(.92)}
.sec{font-size:16px;font-weight:900;color:#1F8A97;margin:18px 2px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:9px}
.wc{border:0;background:#fff;border-radius:18px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 #E8EFF0;position:relative;min-height:92px;justify-content:center}
.wc:active,.wc.hit{transform:scale(.94)}
.wc .cp{line-height:1;display:flex;align-items:center;justify-content:center;min-height:50px}
.wc .cp .emo{font-size:42px}.wc .cp .emo.some{font-size:26px}.wc .cp .emo.many{font-size:18px}
.wc .cp svg{width:58px;height:50px}
.wc .cp .sw{width:46px;height:46px}
.wc .cw{font-weight:900;font-size:18px;line-height:1.15;text-align:center}
.wc.nop .cw{font-size:28px}
.wc .cb{position:absolute;top:6px;left:7px;font-size:13px;font-weight:900;color:#fff;background:#F26B4F;border-radius:8px;padding:1px 6px}
.wc.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;min-height:0}
.wc.wide .cw{text-align:left;font-size:17px}
.wc.wide .cp{min-height:0}
.wc.wide .cp .emo{font-size:30px}
.wc.cv{background:#FFE1DC}.wc.cv .cw{color:#D8382F}
.wc.cc{background:#DDEBFF}.wc.cc .cw{color:#1E5FC9}
.wc.cs{background:#ECEFF1}.wc.cs .cw{color:#68787C}
.cards.abcg{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.cards.abcg .wc{min-height:56px;padding:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:800;margin:-2px 2px 10px;color:#4B6B71}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.cta{text-align:center;margin-top:24px}
.stage{animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.prompt{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 #EFE3C2}
.prompt .q{font-weight:900;font-size:21px;line-height:1.25}
.pic{display:flex;justify-content:center;align-items:center;margin:16px 0 6px;min-height:70px}
.emo{font-size:92px;line-height:1.05;text-align:center}
.emo.some{font-size:66px}
.emo.many{font-size:40px;max-width:330px;line-height:1.25;letter-spacing:2px}
.pic svg{width:150px;height:130px}
.pic .scene{width:220px;height:150px}
.pic .house{width:170px;height:180px}
.sw{display:inline-block;width:110px;height:110px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 0 0 3px rgba(0,0,0,.06)}
.ptxt{font-size:28px;font-weight:900;background:#fff;border-radius:18px;padding:12px 20px;box-shadow:0 4px 0 #E8EFF0;letter-spacing:1px;text-align:center}
.pletter{font-size:90px;font-weight:900;color:#1F8A97;line-height:1}
.seq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.seq .si .emo{font-size:40px}.seq .si svg{width:48px;height:48px}.seq .si .sw{width:44px;height:44px}
.seq .q{width:52px;height:52px;border:3px dashed #33B4C0;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:26px;color:#33B4C0}
.lab{text-align:center;font-weight:900;font-size:24px;color:#1F8A97;min-height:4px}
.lab.rev{color:#2EB872;font-size:26px;min-height:0}
.lab.rev:not(:empty){animation:pop .4s}
.opts{display:grid;gap:11px;margin-top:16px}
.g1{grid-template-columns:1fr}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:3px solid #E1ECEE;background:#fff;border-radius:18px;min-height:64px;padding:10px 8px;font-weight:900;font-size:22px;box-shadow:0 4px 0 #D3E2E5;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;transition:background .15s,border-color .15s}
.g1 .opt{font-size:19px;justify-content:flex-start;padding:12px 16px;text-align:left}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #D3E2E5}
.opt.big{min-height:96px}
.opt .oemo{font-size:52px;line-height:1}
.opt svg{width:66px;height:62px}
.opt .sw{width:54px;height:54px}
.opt.ok,.mi.ok,.syl.ok,.chip.ok{background:#DDF7E8;border-color:#2EB872;box-shadow:0 4px 0 #9FDDBA}
.opt.bad,.mi.bad,.syl.bad{background:#FFE3E1;border-color:#F0544F;animation:shake .4s}
.opt.bad:disabled{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.opt.ol{justify-content:flex-start;gap:12px}
.olL{width:34px;height:34px;flex:none;border-radius:50%;background:#E3F5F7;color:#1F8A97;display:grid;place-items:center;font-size:18px}
.olB{width:34px;height:34px;flex:none;border:3px solid #9FB8BD;border-radius:6px;display:grid;place-items:center;font-size:24px;color:#E0302A;font-weight:900;background:#fff}
.opt.ol.ok .olB:after,.orow.on .olB:after{content:'✕'}
.opt.ol .oc .oemo{font-size:30px}
/* gap */
.tiles{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.tile{min-width:52px;height:60px;padding:0 6px;border-radius:12px;background:#fff;border:3px solid #CFE0E3;display:grid;place-items:center;font-weight:900;font-size:30px}
.tile.b{border:3px dashed #F5B700;background:#FFF6C9;color:#2EB872}
.tile.b:not(:empty){animation:pop .4s;border-style:solid;border-color:#2EB872;background:#DDF7E8}
.sent{font-size:26px;font-weight:900;text-align:center;margin:16px 0 4px;line-height:1.6}
.blank{display:inline-block;min-width:54px;border-bottom:4px dashed #F5B700;background:#FFF6C9;border-radius:8px;padding:0 6px;margin:0 3px}
.blank.f{border-bottom:4px solid #2EB872;background:#DDF7E8;color:#1E9A5A;animation:pop .4s}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:3px solid #E1ECEE;background:#fff;border-radius:16px;min-height:62px;padding:8px;font-weight:900;font-size:18px;box-shadow:0 4px 0 #D3E2E5;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;line-height:1.2;position:relative}
.mi .oemo{font-size:38px}
.mi svg{width:46px;height:44px}
.mi.sel{border-color:#FDD610;background:#FFF6C9;transform:scale(1.04)}
.mi.ok{background:var(--pc,#DDF7E8);border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.mi.ok:after{content:attr(data-n);position:absolute;top:-8px;right:-6px;width:24px;height:24px;border-radius:50%;background:#2EB872;color:#fff;font-size:13px;display:grid;place-items:center}
/* order */
.slots{min-height:76px;border:3px dashed #9FD3D9;border-radius:20px;background:rgba(255,255,255,.6);display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-items:center;justify-content:center;margin-top:16px}
.slots.ok{border-style:solid;border-color:#2EB872;background:#DDF7E8}
.slots.bad{border-color:#F0544F;animation:shake .4s}
.slots .ph{color:#8AB3B9;font-weight:800;font-size:15px}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px}
.chip{border:3px solid #E1ECEE;background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;font-size:22px;box-shadow:0 4px 0 #D3E2E5;min-width:52px}
.chip.lt{min-width:58px;font-size:30px;padding:8px 12px}
.chip.gh{visibility:hidden}
.chip.in{background:#E3F5F7;border-color:#9FD3D9}
.final{text-align:center;font-size:26px;font-weight:900;color:#1E9A5A;margin-top:12px;animation:pop .4s}
/* syl */
.syls{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:18px;flex-wrap:wrap}
.syl{border:3px solid #E1ECEE;background:#fff;border-radius:18px;min-width:84px;height:84px;padding:0 12px;font-weight:900;font-size:36px;box-shadow:0 4px 0 #D3E2E5}
.syl.dim{opacity:.55}
.dash{font-size:30px;font-weight:900;color:#9FB8BD}
.st{color:#E0302A}
/* story */
.story{background:#FFF4CC;border-radius:20px;padding:12px 16px 14px;margin-bottom:12px;box-shadow:0 4px 0 #EFD98A}
.story .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:19px;margin-bottom:4px;color:#8A6400}
.story p{font-size:19px;font-weight:700;line-height:1.5}
/* tip */
.tipbox{text-align:center}
.tipbear{width:150px;margin:10px auto 0;display:block}
.tipbox .bigbub{text-align:left;margin:0 0 22px}
.tipbox .bigbub:after{left:50%;top:-12px;bottom:auto;border:12px solid transparent;border-top:0;border-bottom-color:#fff;margin-left:-12px}
/* buddy */
.buddy{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:8px 14px 12px;max-width:620px;margin:0 auto;pointer-events:none;z-index:5}
.buddy img{width:70px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
.bub{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:900;font-size:17px;box-shadow:0 4px 0 #EFE3C2;margin-bottom:12px;min-height:22px}
.bub:empty{display:none}
.bub.go{animation:pop .35s}
.bub.g{background:#DDF7E8;color:#1E7A48}
.bub.b{background:#FFE9E7;color:#B5302B}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(16,48,54,.55);display:grid;place-items:center;z-index:50;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:28px;padding:22px 20px 24px;max-width:420px;width:100%;text-align:center;animation:pop .35s}
.modal h2{font-size:26px;font-weight:900;color:#1F8A97;margin:4px 0 6px}
.modal p{font-size:17px;font-weight:700;color:#4B6B71}
.modal .mbr{width:120px;margin:-6px auto 0;display:block}
.bigstars{font-size:46px;letter-spacing:4px;margin:6px 0}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars span:nth-child(2){animation-delay:.2s}.bigstars span:nth-child(3){animation-delay:.4s}
.bigstars .off{filter:grayscale(1);opacity:.25}
.modal .row{margin-top:18px}
.modal .btn{font-size:17px;padding:12px 16px}
.score{font-size:54px;font-weight:900;color:#16383F;line-height:1}
.score small{font-size:22px;color:#6B8287}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:110%;transform:rotate(720deg) translateX(50px)}}
/* olympiad */
.otop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.timer{flex:1;text-align:center;font-weight:900;font-size:22px;color:#1F8A97}
.timer.low{color:#E0302A}
.sheet{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:14px}
.sheet button{border:0;height:34px;border-radius:9px;background:#fff;font-weight:900;font-size:14px;box-shadow:0 3px 0 #DCE7E9;padding:0}
.sheet button.a{background:#33B4C0;color:#fff;box-shadow:0 3px 0 #1F8A97}
.sheet button.c{outline:3px solid #FDD610}
.oq{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 #EFE3C2}
.oq .num{font-weight:900;color:#F26B4F;font-size:15px;margin-bottom:4px}
.orows{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.orow{border:3px solid #E1ECEE;background:#fff;border-radius:16px;padding:9px 12px;display:flex;align-items:center;gap:12px;font-weight:900;font-size:19px;text-align:left;box-shadow:0 3px 0 #D3E2E5}
.orow.on{border-color:#FDD610;background:#FFFBE6}
.orow .oemo{font-size:30px}
.onav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.rev-list{text-align:left;margin-top:14px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.rv{background:#F5FAFB;border-radius:14px;padding:9px 12px;font-size:15px;font-weight:700}
.rv b{font-weight:900}
.rv.ok{background:#E6F8EE}.rv.no{background:#FFEDEB}
/* stars page */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.sslot{background:#fff;border-radius:20px;padding:12px 6px;text-align:center;box-shadow:0 4px 0 #EFE3C2}
.sslot .s{font-size:44px;line-height:1.1}
.sslot .s.off{filter:grayscale(1);opacity:.2}
.sslot small{display:block;font-weight:800;font-size:13px;color:#6B8287}
/* diploma */
.dip{background:#fff;border-radius:22px;padding:20px 18px 18px;text-align:center;border:8px solid #33B4C0;box-shadow:0 0 0 4px #FDD610,0 10px 30px rgba(0,0,0,.08);position:relative;margin-top:16px}
.dip .dl{width:84px}
.dip h2{font-size:42px;font-weight:900;color:#1F8A97;letter-spacing:3px;margin-top:2px}
.dip .dsub{font-weight:900;font-size:18px;color:#F26B4F}
.dip .dnm{font-size:30px;font-weight:900;border-bottom:3px dashed #33B4C0;margin:14px 10px 10px;min-height:44px}
.dip .dtx{font-weight:700;font-size:16px;color:#4B6B71}
.dip .dfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;font-weight:800;font-size:14px;color:#4B6B71}
.dip .db{width:80px}
.inp{width:100%;font-family:inherit;font-size:20px;font-weight:800;padding:12px 16px;border-radius:16px;border:3px solid #CFE0E3;background:#fff;color:#16383F;margin-top:8px}
.inp:focus{outline:none;border-color:#33B4C0}
.lock{background:#fff;border-radius:22px;padding:18px;text-align:center;font-weight:800;font-size:18px;box-shadow:0 4px 0 #EFE3C2;margin-top:16px}
.mt.lk{border-bottom-color:#C9D6D9;background:#F7FAFA}.mt.lk .mn{background:#B8C7CB}.lkt{margin-top:auto;font-size:12px;font-weight:800;color:#6B8287}
.inp.code{text-align:center;font-size:28px;letter-spacing:6px;font-weight:900}.inp.bad{border-color:#F0544F;animation:shake .4s}.msg{font-weight:900;margin-top:12px;min-height:22px;font-size:16px}
.foot a{color:#1F8A97;font-weight:900;text-decoration:none}
/* parents */
.pcard{background:#fff;border-radius:20px;padding:14px 16px;margin-top:12px;box-shadow:0 4px 0 #EFE3C2}
.pcard h3{font-size:18px;font-weight:900;color:#1F8A97;margin-bottom:8px}
.pcard ol,.pcard ul{margin:0;padding-left:22px}
.pcard li{font-weight:700;font-size:15px;line-height:1.45;margin-bottom:6px}
.pcard p{font-weight:700;font-size:15px;line-height:1.45}
.contact{font-weight:900;font-size:17px;line-height:1.6}
@media (max-width:380px){.prompt .q{font-size:19px}.opt{font-size:20px}.g4 .opt{font-size:17px;padding:8px 4px}.home h1{font-size:38px}.syl{min-width:70px;height:74px;font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

async function hashCode(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('llh:'+normCode(s)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function shapeSVG(n,c){const f=COL[c]||'#33B4C0',st=c==='белый'?'stroke="#9E9E9E" stroke-width="3"':'';const sh={'круг':`<circle cx="50" cy="50" r="40" fill="${f}" ${st}/>`,'квадрат':`<rect x="13" y="13" width="74" height="74" rx="4" fill="${f}" ${st}/>`,'треугольник':`<polygon points="50,10 92,86 8,86" fill="${f}" ${st} stroke-linejoin="round"/>`,'прямоугольник':`<rect x="4" y="27" width="92" height="46" rx="4" fill="${f}" ${st}/>`,'овал':`<ellipse cx="50" cy="50" rx="45" ry="29" fill="${f}" ${st}/>`};return `<svg viewBox="0 0 100 100">${sh[n]||''}</svg>`}
function whereSVG(p){
 const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="14" fill="#F0544F"/><path d="M${x-14} ${y}a14 14 0 0 0 28 0" fill="#B83430" opacity=".35"/><circle cx="${x-5}" cy="${y-5}" r="4" fill="#fff" opacity=".75"/>`;
 const floor='<rect x="0" y="127" width="200" height="4" rx="2" fill="#CFE3E6"/>';
 const table='<rect x="40" y="62" width="120" height="10" rx="3" fill="#A0673E"/><rect x="48" y="72" width="8" height="55" fill="#8D5B3A"/><rect x="144" y="72" width="8" height="55" fill="#8D5B3A"/>';
 const boxOpen='<polygon points="60,63 42,44 74,48 84,63" fill="#E7B47A" stroke="#B07A44" stroke-width="2"/><polygon points="140,63 158,44 126,48 116,63" fill="#E7B47A" stroke="#B07A44" stroke-width="2"/><rect x="60" y="62" width="80" height="65" rx="3" fill="#D9A066" stroke="#B07A44" stroke-width="2"/>';
 const boxClosed='<rect x="58" y="58" width="84" height="69" rx="3" fill="#D9A066" stroke="#B07A44" stroke-width="2"/><rect x="94" y="58" width="12" height="69" fill="#C98F55"/>';
 const s={'на':table+ball(100,48),'под':table+ball(100,113),'над':table+ball(100,20)+'<path d="M86 40q14 6 28 0" stroke="#9FB8BD" stroke-width="3" fill="none" stroke-dasharray="4 4"/>','у':table+ball(180,113),'в':ball(100,60)+boxOpen,'за':ball(132,48)+boxClosed}[p]||'';
 return `<svg viewBox="0 0 200 135" class="scene">${floor}${s}</svg>`}
const HOUSE='<svg viewBox="0 0 160 170" class="house"><polygon points="12,72 80,12 148,72" fill="#F26B4F" stroke-linejoin="round"/><circle cx="80" cy="50" r="11" fill="#FDD610"/><rect x="25" y="72" width="110" height="84" fill="#33B4C0"/><rect x="38" y="86" width="26" height="26" fill="#fff" stroke="#1F8A97" stroke-width="3"/><rect x="96" y="86" width="26" height="26" fill="#fff" stroke="#1F8A97" stroke-width="3"/><rect x="68" y="106" width="24" height="50" fill="#8D5B3A"/><rect x="0" y="156" width="160" height="6" rx="3" fill="#CFE3E6"/></svg>';
function pic(p){
 if(!p)return '';
 if(p.startsWith('shape:')){const a=p.split(':');return shapeSVG(a[1],a[2])}
 if(p.startsWith('color:'))return `<span class="sw" style="background:${COL[p.slice(6)]}"></span>`;
 if(p.startsWith('svg:'))return ICON[p.slice(4)]||'';
 if(p.startsWith('where:'))return whereSVG(p.slice(6));
 if(p==='house')return HOUSE;
 if(p.startsWith('seq:'))return `<div class="seq">${p.slice(4).split('|').map(x=>x==='?'?'<span class="q">?</span>':`<span class="si">${pic(x)}</span>`).join('')}</div>`;
 if(p.startsWith('txt:'))return `<div class="ptxt">${fmt(p.slice(4)).replace('_','<span class="blank">&nbsp;</span>')}</div>`;
 if(p.startsWith('letter:'))return `<div class="pletter">${esc(p.slice(7))}</div>`;
 const n=gcount(p);
 return `<span class="emo ${n>6?'many':n>1?'some':''}">${esc(p)}</span>`;
}
function optHTML(o){if(isTok(o)&&!o.startsWith('txt:'))return pic(o);if(isEmo(o))return `<span class="oemo">${esc(o)}</span>`;
 const m=/^([\p{Extended_Pictographic}️‍]+)\s+(.+)$/u.exec(o);if(m)return `<span class="oemo" style="font-size:30px">${esc(m[1])}</span><span>${fmt(m[2])}</span>`;return fmt(o)}

const EMO={'🚌':'автобус','🚆':'поезд','✈️':'самолёт','🍽️':'тарелка','🥄':'ложка','☕':'чашка','🍊':'апельсин','🎄':'ёлка','🐜':'муравей','🐆':'гепард','🐢':'черепаха','🦞':'рак','🔪':'нож','🌙':'луна','🍦':'мороженое','🍵':'чай','🫖':'чайник','🥛':'молоко','🧒':'ребёнок','🧍':'человек'};
DATA.forEach(m=>m.lessons.forEach(l=>(l.cards||[]).forEach(c=>{if(Array.isArray(c)&&c[0]&&isEmo(c[0])&&gcount(c[0])===1&&!c[1].includes('→')){const w=c[1].replace(/́/g,'').replace(/-/g,'');if(!EMO[c[0]])EMO[c[0]]=w;EMO[c[0].replace(/️/g,'')]=EMO[c[0]]}})));
function sayTok(o){if(!o)return '';
 if(o.startsWith('shape:')){const a=o.split(':');return (a[2]?a[2]+' ':'')+a[1]}
 if(o.startsWith('color:'))return o.slice(6);
 if(o.startsWith('svg:'))return ({table:'стол',wardrobe:'шкаф',lamp:'лампа'})[o.slice(4)]||'';
 if(o.startsWith('txt:'))return o.slice(4);
 if(o.startsWith('letter:'))return LN[o.slice(7)]||o.slice(7);
 if(o.startsWith('where:')||o.startsWith('seq:')||o==='house')return '';
 if(isEmo(o)){return EMO[o]||EMO[o.replace(/️/g,'')]||''}
 if(/^[А-ЯЁ]$/.test(o))return LN[o];
 return o}

/* ================= lesson engine ================= */
function prep(t){const c=Object.assign({},t);
 if(c.opts){c.opts=c.opts.slice();if(!c.k)c.opts=shuffle(c.opts)}
 return c}
function normCard(c){return Array.isArray(c)?{p:c[0],w:c[1],b:c[2]}:c}
function cardSay(c){if(c.say)return c.say;if(c.b&&/^[А-ЯЁ][а-яё]$/.test(c.b))return LN[c.b[0]]+'. '+c.w;if(c.b&&/^(он|она|оно|они)$/.test(c.b))return c.w+' — '+c.b;if(c.b&&!/^\d+$/.test(c.b)&&c.w.length<12)return c.w+' — '+c.b;return c.w.replace(/-/g,'')}

function startLesson(mi,li){if(isLocked(mi))return openGate(mi);go();const les=DATA[mi].lessons[li];
 if(les.olymp)return olyIntro(mi,li);
 L={mi,li,les,tasks:les.tasks.map(prep),i:-1,mist:0,mode:'lesson'};
 rIntro();
}
function startTest(mi){if(isLocked(mi))return openGate(mi);go();
 const pool=[];DATA[mi].lessons.forEach(l=>(l.tasks||[]).forEach(t=>{if(t.t==='c'||t.t==='g'||t.t==='y')pool.push(t)}));
 L={mi,li:-1,les:{title:'Тест месяца '+(mi+1)},tasks:sample(pool,10).map(prep),i:-1,mist:0,score:0,mode:'test'};
 rIntro();
}
function rIntro(){const les=L.les,isT=L.mode==='test';
 const cards=(les.cards||[]).map(normCard);L.cards=cards;
 const intro=isT?'Тест месяца! Тут 10 заданий и только одна попытка в каждом. Нужно 7 правильных ответов из 10 — тогда ты получишь звёздочку. Не спеши!':les.intro;
 app.innerHTML=`<div class="lbar"><button class="ib" id="xbtn" aria-label="Выйти">✕</button><div class="ltitle">${esc(les.title)}</div>${sndBtn()}</div>
 <div class="stage"><div class="introbox"><img src="${BEAR}" class="ibear" alt="Мишутка"><div class="bigbub">${fmt(intro)} <button class="say sm" id="sayi" aria-label="Послушать">🔊</button></div></div>
 ${cards.length?`<h3 class="sec">👂 Нажми на карточку — послушай слово</h3>${les.abc?'<div class="legend"><span><i style="background:#FFB3A9"></i>гласные</span><span><i style="background:#A9C8FF"></i>согласные</span><span><i style="background:#CFD6D9"></i>знаки</span></div>':''}<div class="cards ${les.abc?'abcg':''}">${cards.map((c,i)=>`<button class="wc ${c.cls||''} ${c.w.length>16?'wide':''} ${c.p?'':'nop'}" data-c="${i}">${c.b?`<span class="cb">${esc(c.b)}</span>`:''}${c.p?`<span class="cp">${pic(c.p)}</span>`:''}<span class="cw">${fmt(c.w)}</span></button>`).join('')}</div>`:''}
 <div class="cta"><button class="btn big" id="go">${isT?'Начать тест ▶':'Играть ▶'}</button></div></div>`;
 $('#xbtn').onclick=()=>openMonth(L.mi);bindSnd();
 $('#sayi').onclick=()=>speak(intro);
 $$('.wc').forEach(b=>b.onclick=()=>{const c=cards[+b.dataset.c];speak(cardSay(c));b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),180)});
 $('#go').onclick=()=>{ac();sfx.tap();next()};
}
function next(){if(!L)return;L.i++;if(L.i>=L.tasks.length)return finish();window.scrollTo(0,0);const t=L.tasks[L.i];
 ({c:rChoice,g:rGap,m:rMatch,o:rOrder,y:rSyl,tip:rTip})[t.t](t);
 if(t.t!=='tip')setTimeout(()=>{if(L&&L.tasks[L.i]===t)speak(qSay(t))},350);
}
function qSay(t){if(t.say)return t.say;let s=t.q||'';if(t.pic&&t.pic.startsWith('txt:'))s+=' '+t.pic.slice(4);if(t.t==='g'&&/\s/.test(t.w)&&t.w.split(' ').some(x=>x.length>2))s+='. '+t.w;return s}
function frame(inner){const n=L.tasks.length,p=Math.max(0,L.i)/n*100;
 app.innerHTML=`<div class="lbar"><button class="ib" id="xbtn" aria-label="Выйти">✕</button><div class="prog"><i style="width:${p}%"></i></div>${sndBtn()}</div><div class="stage">${inner}</div><div class="buddy"><img src="${HEAD}" alt=""><div class="bub" id="bub">${L.mode==='test'?'Задание '+(L.i+1)+' из '+n:''}</div></div>`;
 $('#xbtn').onclick=()=>{const mi=L.mi;if(L.mode==='test'&&L.i>0)ask('Выйти из теста?','Выйти','Остаться',()=>openMonth(mi));else openMonth(mi)};bindSnd();
 requestAnimationFrame(()=>{const i=$('.prog i');if(i)i.style.width=p+'%'});
}

 <div class="prompt"><button class="say" id="sayq" aria-label="Послушать">🔊</button><div class="q">${t.lab==='Загадка'?'<small style="color:#F26B4F;display:block;font-size:14px">Загадка</small>':''}${fmt(t.q)}</div></div>
 ${t.pic?`<div class="pic">${pic(t.pic)}</div>`:''}${t.lab&&t.lab!=='Загадка'?`<div class="lab">${fmt(t.lab)}</div>`:''}<div class="lab rev" id="rev"></div>`}
function bindHead(t){$('#sayq').onclick=()=>speak(qSay(t));const s=$('#says');if(s)s.onclick=()=>speak(t.text.title+'. '+t.text.body)}
const PRAISE=['Молодец!','Отлично!','Умница!','Верно!','Супер!','Так держать!','Здорово!','Браво!'];
const OOPS=['Попробуй ещё!','Подумай ещё раз','Почти! Ещё разок','Не спеши, посмотри внимательно'];
function bub(txt,cls){const b=$('#bub');if(!b)return;b.className='bub '+(cls||'');void b.offsetWidth;b.classList.add('go');b.textContent=txt}
function ansSay(t){const a=t.a;
 if(t.t==='g'){const full=t.w.replace('_',a);const tk=full.split(' ');return (tk.length>1&&tk.every(x=>/^[А-ЯЁ]$/.test(x)))?tk.map(x=>LN[x]).join(', '):full}
 if(t.q&&t.q.includes('…')&&!isTok(a)&&!isEmo(a))return t.q.replace('…',a);
 if(t.w)return t.w;
 if(t.lab&&t.lab!=='Загадка')return t.lab+' — '+sayTok(a);
 return sayTok(a)}
function good(t){sfx.ok();if(L.mode==='test')L.score++;bub(PRAISE[Math.floor(Math.random()*PRAISE.length)],'g');
 if(t.w){const r=$('#rev');if(r)r.textContent=t.w}
 setTimeout(()=>speak(ansSay(t)),150);later(next,L.mode==='test'?1300:1500)}
function bad(){sfx.bad();L.mist++;bub(L.mode==='test'?'Ой! Правильный ответ — зелёный.':OOPS[Math.floor(Math.random()*OOPS.length)],'b')}

function gridCls(opts,ol){if(ol)return 'g1';

  $('#tok').onclick=async()=>{let g=false;try{g=await tryCode($('#tcd').value)}catch(e){}if(g){S.all=1;save();openMonth(mi)}else $('#tgm').textContent='Код нотўғри · Неверный код'}};
 return}
 app.innerHTML=`<div class="bar"><button class="ib" id="back" aria-label="Назад">←</button><div class="btitle">${mi!=null?'Месяц '+(mi+1):'Полный доступ'}</div>${sndBtn()}</div>

 <p style="font-size:15px;color:#4B6B71;margin:8px 0 14px">Ҳозир 1-ой ҳамма учун очиқ. Барча 12 ой — Leadership Learning House ўқувчилари учун. Кодни ўқитувчингиздан олинг.<br><br>Сейчас бесплатно открыт 1-й месяц. Все 12 месяцев — для учеников курса. Код выдаёт учитель.</p>

  if(ok){ac();sfx.win();confetti();msg.style.color='#1E7A48';msg.textContent='Ура! Барча ойлар очилди! · Все месяцы открыты!';speak('Ура! Все месяцы открыты!');setTimeout(()=>{if($('#cd')===inp)(mi!=null?openMonth(mi):openMap())},1400)}
  else{gb.disabled=false;inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');sfx.bad();msg.style.color='#B5302B';msg.textContent='Код нотўғри · Неверный код';inp.select()}};
 gb.onclick=sub;inp.onkeydown=e=>{if(e.key==='Enter')sub()};

<script>
(function(){
  try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
  var app=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  var hidden=false;try{hidden=!!localStorage.getItem("mishInstHide")}catch(e){}
  if(app||hidden)return;
  var b=document.getElementById("instBtn"),x=document.getElementById("instX"),tip=document.getElementById("instTip"),ev=null;
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  function show(){b.style.display="flex";x.style.display="block"}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;show()});
  window.addEventListener("appinstalled",function(){b.style.display=x.style.display=tip.style.display="none"});
  if(ios)show();
  setTimeout(function(){if(!ev&&!ios)show()},3000);
  b.onclick=function(){
    if(ev){ev.prompt();ev=null;b.style.display=x.style.display="none";return}
    tip.innerHTML=ios?"Нажмите <b>«Поделиться»</b> (квадрат со стрелкой вверх) → <b>«На экран «Домой»»</b> → <b>«Добавить»</b>.":"Нажмите <b>⋮</b> в правом верхнем углу браузера → <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.";
    tip.style.display=tip.style.display==="block"?"none":"block";
  };
  x.onclick=function(){b.style.display=x.style.display=tip.style.display="none";try{localStorage.setItem("mishInstHide","1")}catch(e){}};
})();
</script>
